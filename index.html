<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacaciones y permisos | Grupo Garrett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#0D6174; --brand-dark:#0A4E5D; --brand-soft:#E4F0F2;
  --ink:#1B2A33; --muted:#66737C; --line:#E2E7EA; --line-strong:#C9D1D6; --sunk:#F6F8F9;
  --pend:#A86C12; --pend-soft:#FBF1DC; --danger:#B3242D; --danger-soft:#FBE7E8; --hol:#8A4F9E; --bday:#C2255C; --bday-soft:#FCEAF1;
  --font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{background:#fff;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
.muted{color:var(--muted)}.small{font-size:13px}

/* Header */
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{width:auto;padding:6px 8px}
.bell{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px}
.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}
.bell i:empty{display:none}
.test{padding:7px 28px;font-size:13px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.test button{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}

main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}

/* Stats */
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;margin-bottom:26px}
.stat{flex:1 1 200px;padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.stat.main strong{color:var(--brand);font-size:30px}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat .owe{color:var(--pend)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--pend);color:#fff;font-size:12px;margin-left:6px;padding:0 6px}

/* Buttons */
.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.lnk.red{color:var(--danger)}
.lnk:hover{text-decoration:underline}
.wide{width:100%}

/* Vacaciones */
.vac{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{margin:0;font-size:19px}
.arrows{display:flex;gap:6px}
.arrow{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
.arrow[disabled]{opacity:.3;cursor:default}
.arrow svg{width:18px;height:18px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.grid{touch-action:none;user-select:none;-webkit-user-select:none}
.day{appearance:none;position:relative;height:58px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:6px 8px;text-align:left;font-weight:600;font-size:14px;display:flex;flex-direction:column;justify-content:space-between}
.day em{font-style:normal;font-size:11px;font-weight:600;line-height:1.1}
.day:hover:not([aria-disabled="true"]){border-color:var(--brand)}
.day[aria-disabled="true"]{cursor:default}
.day.off{border-color:transparent;background:var(--sunk);color:#AAB4BA;font-weight:500}
.day.hol{border-color:transparent;color:var(--hol);background:repeating-linear-gradient(-45deg,#fff 0 5px,#F3EAF6 5px 8px)}
.day.bday{background:var(--bday-soft);border-color:var(--bday);color:var(--bday)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.ok{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.day.pend{background:var(--pend-soft);border:1.5px dashed var(--pend);color:var(--pend)}
.day.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.day.half.sel{background:linear-gradient(135deg,var(--brand) 50%,#9CC6CF 50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{margin-bottom:6px}
.pick{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow-y:auto}
.pick li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pick .d{flex:1;font-size:14px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--danger);background:var(--danger-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--brand);color:#fff}
.seg.lg button{padding:8px 18px;font-size:14px}
.sum{display:flex;justify-content:space-between;padding:12px 0;margin-top:4px;border-top:1px solid var(--line);font-size:14px}
.sum strong{font-size:16px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Lists */
.section{margin-top:34px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows .main{flex:1;min-width:200px}
.rows .main p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rows .amt{font-weight:600;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:12px 0;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.jefatura,.pill.rh{background:var(--pend-soft);color:var(--pend)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.pill.cancel{background:var(--sunk);color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:700;margin-left:2px;opacity:.75}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.kind{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;margin-right:8px;vertical-align:1px}
.kind.v{background:var(--brand-soft);color:var(--brand)}
.kind.p{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.acts{display:flex;gap:8px;align-items:center}
.acts input{width:190px}

/* Permisos */
.perm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.f{display:grid;gap:5px;margin-bottom:14px}
.f>span{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:14px}
.preview.bad{background:var(--danger-soft);color:var(--danger)}

/* Tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
.num{text-align:right}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.formrow .f{margin:0}
.calc{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 18px}
.back{margin-bottom:14px}

/* Drawer + toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.notes{list-style:none;margin:0;padding:6px 20px;overflow-y:auto;flex:1}
.notes li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes p{margin:4px 0 0}
.ch{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;background:var(--brand-soft);color:var(--brand)}
.ch.Outlook{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Resumen */
.dept-h{font-size:14px;font-weight:700;color:var(--brand);margin:22px 0 6px}
.tl{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.tl th,.tl td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.tl th{height:34px;min-width:26px;font-size:11px;line-height:1.1;color:var(--muted);border-bottom:1px solid var(--line-strong)}
.tl th.nm,.tl td.nm{position:sticky;left:0;background:#fff;text-align:left;padding:0 12px 0 2px;min-width:140px;white-space:nowrap;font-size:13px;z-index:1}
.tl td.nm{font-weight:600}
.tl tr.dh td{background:var(--sunk);color:var(--brand);font-weight:700;text-align:left;padding:6px 4px;font-size:12px;position:sticky;left:0}
.tl td.c{height:30px;min-width:26px;border-left:1px solid #F0F3F4}
.tl .wk{background:var(--sunk)}
.tl .hl{background:#F3EAF6}
.tl .td{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tl i{display:block;margin:4px 2px;height:20px;border-radius:4px}
.c-v{background:var(--brand)}
.c-am{background:linear-gradient(135deg,var(--brand) 50%,var(--brand-soft) 50%)}
.c-pm{background:linear-gradient(135deg,var(--brand-soft) 50%,var(--brand) 50%)}
.c-pe{background:var(--pend-soft);border:1.5px dashed var(--pend)}
.c-pr{background:#E8E1F6;border:1px solid #6A4FB6}
.c-bd{background:var(--bday-soft);border:1px solid var(--bday)}
.mail-note{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:18px}
/* Sin goce, acumulado, equipo, selector de fecha */
.warn.soft{background:var(--pend-soft);color:#6E4608}
.tagx{font-size:11px;font-weight:700;color:var(--pend);background:var(--pend-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--pend-soft);color:#6E4608;border-radius:10px;padding:12px 14px;font-size:14px;margin:-6px 0 22px}
.alert strong{color:#5A3905}
.alert svg{flex:none;width:18px;height:18px;margin-top:1px}
.hi{color:var(--pend);font-weight:700}
.cal-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-tools select{width:auto;padding:6px 8px;font-size:13px}
.grid.team .day{height:84px}
.day .ppl{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.day .ppl b{font-size:10px;font-weight:600;line-height:1.3;padding:0 4px;border-radius:4px;background:#DCEBEF;color:var(--brand-dark);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ppl b.p{background:#fff;border:1px dashed var(--pend);color:var(--pend)}
.day .ppl b.more{background:var(--ink);color:#fff}
.day.sel .ppl b{background:#fff;color:var(--brand-dark)}
.day em{margin-top:2px}
.clash{font-size:13px;color:var(--pend);margin:4px 0 0}
.datebtn{appearance:none;width:100%;text-align:left;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.datebtn:hover{border-color:var(--brand)}
.datebtn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.pickwrap{position:relative}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:280px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(20,40,50,.16)}
.pop .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.pop .arrow{width:30px;height:30px}
.pop .dow,.pop .pg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pop .dow span{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.pop .pg button{appearance:none;border:0;background:none;height:32px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.pop .pg button:hover:not([disabled]){background:var(--brand-soft)}
.pop .pg button[disabled]{color:#C3CBD0;cursor:default;font-weight:400}
.pop .pg button.on{background:var(--brand);color:#fff}
.pop .pg button.hol{color:var(--hol)}
@media (max-width:860px){
  .grid.team .day{height:64px}
  .day .ppl b:not(.more){display:none}
  .top{padding:12px 16px}.test{padding:7px 16px}
  .top .app-name{display:none}
  main{padding:20px 14px 60px}
  .vac,.perm{grid-template-columns:1fr}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .day{height:48px;padding:4px 5px}
  .day em{display:none}
  .acts{width:100%}.acts input{flex:1;width:auto}
}
/* Inicio y estado */
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate h1{margin-bottom:10px}
.gate p{color:var(--muted);margin:0 0 20px}
.gate .formrow{text-align:left}
body.busy{cursor:progress}
body.busy .btn,body.busy .lnk{pointer-events:none;opacity:.6}
#whoami{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
a.btn{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const pad=n=>String(n).padStart(2,'0');
const K=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const NOW=new Date(), TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()), TK=K(TODAY);

const fL=k=>clean(lF.format(P(k)));

const dias=x=>`${num(x)} ${Math.abs(x)===1?'día':'días'}`;

/* ---------- Inicio de sesión (Microsoft) ---------- */
async function initAuth(){
  G.pca=new msal.PublicClientApplication({
    auth:{clientId:CONFIG.clientId,authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`,redirectUri:location.origin+location.pathname},

  });

  G.account=res?.account||G.pca.getAllAccounts()[0]||null;
}

const logout=()=>G.pca.logoutRedirect({account:G.account,postLogoutRedirectUri:location.origin+location.pathname});
async function token(){
  try{return (await G.pca.acquireTokenSilent({scopes:SCOPES,account:G.account})).accessToken}
  catch(e){await G.pca.acquireTokenRedirect({scopes:SCOPES,account:G.account});throw new Error('redirect')}
}

/* ---------- Microsoft Graph ---------- */
class GraphError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function gx(method,path,body){
  const url=path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path;
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new GraphError(r.status,j?.error?.message||r.statusText);
  return j;
}
async function allItems(list){
  let url=`/sites/${G.siteId}/lists/${G.listIds[list]}/items?$expand=fields&$top=999`,out=[];
  while(url){const j=await gx('GET',url);out=out.concat(j.value);url=j['@odata.nextLink']||null}
  return out;
}

async function loadAll(){

    spId:i.id,id:lc(f.Correo),email:lc(f.Correo),name:f.Title||'(sin nombre)',dept:f.Departamento||'',role:ROLE_IN[f.Perfil]||'colab',

    return{id:'V'+i.id,spId:i.id,emp:lc(f.EmpleadoCorreo),days,unpaid:+f.DiasSinGoce||0,note:f.Nota||'',status:EST_IN[f.Estado]||'jefatura',reason:f.Comentario||'',created:Date.parse(i.createdDateTime)||0}});
  const perms=pm.map(i=>{const f=i.fields;return{id:'P'+i.id,spId:i.id,emp:lc(f.EmpleadoCorreo),k:rd(f.Fecha),start:fromHHMM(f.HoraSalida),hours:+f.Horas||1,motive:f.Motivo||'',
    repK:rd(f.FechaReposicion),repStart:fromHHMM(f.HoraReposicion),status:EST_IN[f.Estado]||'jefatura',repaid:f.Repuesto===true,reason:f.Comentario||'',created:Date.parse(i.createdDateTime)||0}});

/* Guarda algo en SharePoint, recarga y vuelve a pintar */
async function act(fn,okMsg){
  if(busy)return;busy=true;document.body.classList.add('busy');

/* ---------- Model ---------- */
const who=id=>(S.all||[]).find(p=>p.id===id);
const me=()=>S.people.find(p=>p.id===V.user);
const dv=p=>p==='full'?1:.5;
const total=d=>d.reduce((s,x)=>s+dv(x.p),0);
/* Acumulación: 1 día por cada mes cumplido desde la fecha de ingreso (ej.: entra el 16 de octubre, gana 1 día el 16 de noviembre, otro el 16 de diciembre...).
   Si el mes no tiene ese día (31, 30, 29), se gana el último día del mes. */
const POR_MES=1;
function monthiv(start,n){const s=P(start),y=s.getFullYear(),mo=s.getMonth()+n,dim=new Date(y,mo+1,0).getDate();return new Date(y,mo,Math.min(s.getDate(),dim))}
function accMonths(start,ref){ref=ref||TODAY;const s=P(start);let n=(ref.getFullYear()-s.getFullYear())*12+ref.getMonth()-s.getMonth();if(n>0&&monthiv(start,n)>ref)n--;return Math.max(0,n)}
const earnedFrom=start=>accMonths(start)*POR_MES;
function nextAccrual(start){return K(monthiv(start,accMonths(start)+1))}
function bal(id){
  const p=who(id);let ap=0,pe=0;
  S.reqs.forEach(r=>{if(r.emp!==id)return;const t=total(r.days)-(r.unpaid||0);if(r.status==='ok')ap+=t;else if(live(r.status))pe+=t});
  const earned=earnedFrom(p.start);const avail=earned-p.prior-ap;
  return{earned,taken:p.prior+ap,pending:pe,avail,free:avail-pe};
}
const owedL=id=>S.perms.filter(x=>x.emp===id&&x.status==='ok'&&!x.repaid).sort((a,b)=>a.repK.localeCompare(b.repK));
const owed=id=>owedL(id).reduce((s,x)=>s+x.hours,0);
function booked(id){const m=new Map();S.reqs.forEach(r=>{if(r.emp===id&&live(r.status))r.days.forEach(d=>m.set(d.k,{p:d.p,st:r.status}))});return m}
const isBday=(id,k)=>{const p=who(id);return !!(p&&p.bday&&p.bday===k.slice(5)&&isBiz(k))};
const canPick=k=>k>=TK&&isBiz(k)&&!booked(V.user).has(k)&&!isBday(V.user,k);
/* Reparte una selección entre días pagados y sin goce (los últimos días son los sin goce) */
function splitPaid(days,free){let left=Math.max(0,free);return [...days].sort((a,b)=>a.k.localeCompare(b.k)).map(d=>{const v=dv(d.p),paid=Math.min(v,left);left-=paid;return{...d,unpaid:v-paid}})}
const firstName=n=>String(n).split(' ')[0];
/* Personas cuyo calendario puede ver quien está conectado */
function visiblePeople(){const u=me();if(u.role==='rh')return S.people.filter(p=>p.id!==u.id);return S.people.filter(p=>p.boss===u.id)}
function teamOptions(){const u=me(),ppl=visiblePeople().sort((a,b)=>a.name.localeCompare(b.name));if(!ppl.length)return '';
  let o=`<option value="none">Solo mis días</option>`;
  if(u.role==='rh'){o+=`<option value="all">Todo el personal</option>`+depts().filter(d=>ppl.some(p=>(p.dept||'Sin departamento')===d)).map(d=>`<option value="dept:${esc(d)}">${esc(d)}</option>`).join('');
    const mine=S.people.filter(p=>p.boss===u.id);if(mine.length)o+=`<option value="team">Mi equipo</option>`}
  else o+=`<option value="team">Todo mi equipo</option>`;
  o+=`<optgroup label="Una persona">${ppl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>`;
  return o.replace(`value="${V.team}"`,`value="${V.team}" selected`)}
function teamFilter(){const v=V.team,ppl=visiblePeople();if(!ppl.length||v==='none')return[];
  if(v==='all')return ppl;if(v==='team')return S.people.filter(p=>p.boss===me().id);if(v.startsWith('dept:'))return ppl.filter(p=>(p.dept||'Sin departamento')===v.slice(5));return ppl.filter(p=>p.id===v)}
function outMap(ppl){const m=new Map(),add=(k,o)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(o)};
  ppl.forEach(p=>{S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status))r.days.forEach(d=>add(d.k,{name:p.name,pend:r.status!=='ok',p:d.p}))});
    S.perms.forEach(x=>{if(x.emp===p.id&&live(x.status))add(x.k,{name:p.name,pend:x.status!=='ok',perm:x.hours})})});
  return m}
/* Quién más del mismo equipo sale en esos días */
function clashes(x){const e=who(x.emp);if(!e||x.id[0]!=='V')return[];const v=me(),peers=S.people.filter(p=>p.id!==e.id&&((e.boss&&p.boss===e.boss)||(e.dept&&p.dept===e.dept))&&(v.role==='rh'||p.boss===v.id));
  const ks=new Set(x.days.map(d=>d.k)),res=[];
  peers.forEach(p=>{const hit=[];S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status)&&r.id!==x.id)r.days.forEach(d=>{if(ks.has(d.k))hit.push(d.k)})});if(hit.length)res.push(`${p.name} (${hit.sort().map(fD).join(', ')})`)});
  return res}
const overLimit=ppl=>ppl.filter(p=>bal(p.id).avail>ACUM);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fB=b=>b?`${+b.slice(3)} de ${MESES[+b.slice(0,2)-1]}`:'—';
const depts=()=>[...new Set(S.people.map(p=>p.dept||'Sin departamento'))].sort((a,b)=>a.localeCompare(b));
function groups(days){const s=[...days].sort((a,b)=>a.k.localeCompare(b.k)),g=[];s.forEach(d=>{const l=g.at(-1);if(l&&nextBiz(l.at(-1).k)===d.k)l.push(d);else g.push([d])});return g}
const hn=p=>p==='am'?'mañana':'tarde';
function summ(days){return groups(days).map(g=>{if(g.length===1)return fD(g[0].k)+(g[0].p!=='full'?` (${hn(g[0].p)})`:'');const h=g.filter(d=>d.p!=='full');return `${fD(g[0].k)} al ${fD(g.at(-1).k)}${h.length?' ('+h.map(d=>fD(d.k)+' '+hn(d.p)).join(', ')+')':''}`}).join(' y ')}
function nextVac(id){const d=[];S.reqs.forEach(r=>{if(r.emp===id&&r.status==='ok')r.days.forEach(x=>{if(x.k>=TK)d.push(x)})});if(!d.length)return null;const g=groups(d)[0];return{label:summ(g),t:total(g)}}
const STATUS={jefatura:'Con jefatura',rh:'Con RH',ok:'Aprobada',no:'Rechazada',cancel:'Cancelada'};
function statusText(x){const b=who(x.emp)?.boss;if(x.status==='jefatura')return `Esperando a ${who(b)?.name||'jefatura'}`;if(x.status==='rh')return 'Esperando a RH';if(x.status==='ok')return x.id[0]==='V'?'Aprobada':'Aprobado';if(x.status==='cancel')return 'Cancelada';return `Rechazada${x.reason?': '+esc(x.reason):''}`}
function queue(){const u=me();return [...S.reqs,...S.perms].filter(x=>{const e=who(x.emp);if(!e)return false;return (x.status==='jefatura'&&e.boss===u.id)||(x.status==='rh'&&u.role==='rh'&&x.emp!==u.id)}).sort((a,b)=>a.created-b.created)}

/* Permisos */
const MOT=['Cita médica','Trámite personal','Asunto familiar','Estudios','Otro'];
function tOpts(a,b,v){let o='';for(let t=a;t<=b;t+=.5)o+=`<option value="${t}" ${t===v?'selected':''}>${fT(t)}</option>`;return o}
function pCheck(f){
  if(!f.k||!f.repK)return[0,'Elige el día del permiso y el día en que lo repones.'];
  if(f.k<TK)return[0,'El permiso no puede ser en una fecha pasada.'];
  if(!isBiz(f.k))return[0,`El ${fD(f.k)} no es día laboral.`];
  if(f.start+f.hours>24)return[0,'El permiso debe terminar el mismo día. Elige una hora más temprano.'];
  if(f.repStart+f.hours>24)return[0,'La reposición debe terminar el mismo día. Elige una hora más temprano.'];
  if(f.motive==='Otro'&&!(f.other||'').trim())return[0,'Escribe una breve explicación del motivo.'];
  if(f.repK<f.k)return[0,'La reposición debe ser el mismo día del permiso o después.'];
  if(f.repK===f.k&&f.repStart<f.start+f.hours&&f.repStart+f.hours>f.start)return[0,'La reposición choca con el horario del permiso.'];
  return[1,`Sales el <strong>${fD(f.k)}</strong> de ${fT(f.start)} a ${fT(f.start+f.hours)} y repones el <strong>${fD(f.repK)}</strong> de ${fT(f.repStart)} a ${fT(f.repStart+f.hours)}`.replace(/\.?$/,'.')];
}

/* Mis solicitudes (vacaciones y permisos, con filtros) */
const isPend=s=>s==='jefatura'||s==='rh';
const EST_F=[['all','Todas'],['pend','En aprobación'],['ok','Aprobadas'],['no','Rechazadas'],['cancel','Canceladas']];
const matchEst=(x,e)=>e==='all'||(e==='pend'?isPend(x.status):x.status===e);
function myItems(){const u=me();return [...S.reqs.filter(r=>r.emp===u.id),...S.perms.filter(x=>x.emp===u.id)]}
const itemDate=x=>x.id[0]==='V'?([...x.days].sort((a,b)=>a.k.localeCompare(b.k))[0]?.k||''):x.k;
function itemRow(x){const u=me(),isV=x.id[0]==='V';
  const head=isV?summ(x.days):`${fD(x.k)}, ${fT(x.start)} a ${fT(x.start+x.hours)}`;
  const sub=isV?statusText(x)+(x.note?` · ${esc(x.note)}`:''):`${esc(x.motive)} · Repone ${fD(x.repK)}, ${fT(x.repStart)}${x.repaid?' · Ya repuesto':''}${x.status==='no'&&x.reason?' · Motivo: '+esc(x.reason):''}${isPend(x.status)?' · '+statusText(x):''}`;
  const amt=isV?`${dias(total(x.days))}${x.unpaid?` <span class="tagx">${num(x.unpaid)} sin goce</span>`:''}`:`${x.hours} h`;
  const pill=isV?STATUS[x.status]:(x.status==='ok'&&x.repaid?'Repuesto':STATUS[x.status].replace('Aprobada','Aprobado').replace('Rechazada','Rechazado').replace('Cancelada','Cancelado'));
  const can=u.role==='rh'&&isPend(x.status)?`<button class="lnk red" data-act="${isV?'cancelReq':'cancelPerm'}" data-id="${x.id}">Cancelar</button>`:'';
  return `<li><div class="main"><strong><span class="kind ${isV?'v':'p'}">${isV?'Vacaciones':'Permiso'}</span>${head}</strong><p>${sub}</p></div><span class="amt">${amt}</span><span class="pill ${x.status}">${pill}</span>${can}</li>`}
function pendBox(t){const all=myItems().filter(x=>x.id[0]===t),pend=all.filter(x=>isPend(x.status)).sort((a,b)=>b.created-a.created);
  const name=t==='V'?'vacaciones':'permisos';
  return `<div class="section"><div class="bar"><h2>${t==='V'?'Solicitudes':'Permisos'} en aprobación</h2>${all.length?`<button class="btn sm" data-tab="mis" data-mft="${t}">Ver todas (${all.length})</button>`:''}</div>

function vMis(){

function vRes(){
  const m=V.rm,y=m.getFullYear(),mo=m.getMonth(),dim=new Date(y,mo+1,0).getDate(),ks=Array.from({length:dim},(_,i)=>K(new Date(y,mo,i+1)));
  const L=['D','L','K','M','J','V','S'];
  const cell=(p,k)=>{let c='',why='';
    for(const r of S.reqs){if(r.emp!==p.id||!live(r.status))continue;const d=r.days.find(x=>x.k===k);if(d){c=r.status!=='ok'?'c-pe':d.p==='full'?'c-v':d.p==='am'?'c-am':'c-pm';why=(r.status!=='ok'?'Vacaciones en aprobación':'Vacaciones')+(d.p!=='full'?` (${hn(d.p)})`:'');break}}
    if(!c){const pr=S.perms.find(x=>x.emp===p.id&&x.k===k&&live(x.status));if(pr){c='c-pr';why=`Permiso ${pr.hours} h: ${pr.motive}`}}
    if(!c&&isBday(p.id,k)){c='c-bd';why='Cumpleaños'}
    const cls=['c'];if(isWk(k))cls.push('wk');if(S.hol[k])cls.push('hl');if(k===TK)cls.push('td');
    return `<td class="${cls.join(' ')}" title="${esc(p.name)}, ${fD(k)}${why?': '+why:''}">${c?`<i class="${c}"></i>`:''}</td>`};
  const rows=depts().map(d=>`<tr class="dh"><td colspan="${dim+1}">${esc(d)}</td></tr>`+S.people.filter(p=>(p.dept||'Sin departamento')===d).map(p=>`<tr><td class="nm">${esc(p.name)}</td>${ks.map(k=>cell(p,k)).join('')}</tr>`).join('')).join('');
  const out=[];S.people.forEach(p=>{const days=[];S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status))r.days.forEach(d=>{if(d.k.startsWith(K(m).slice(0,7)))days.push({...d,st:r.status})})});
    if(days.length)out.push({p,label:summ(days),t:total(days),pend:days.some(d=>d.st!=='ok')});
    S.perms.filter(x=>x.emp===p.id&&live(x.status)&&x.k.startsWith(K(m).slice(0,7))).forEach(x=>out.push({p,label:`${fD(x.k)}, permiso de ${x.hours} h (${x.motive})`,t:null,pend:x.status!=='ok'}));
    ks.forEach(k=>{if(isBday(p.id,k))out.push({p,label:`${fD(k)}, cumpleaños`,t:null,pend:false})})});
  out.sort((a,b)=>(a.p.dept||'').localeCompare(b.p.dept||'')||a.p.name.localeCompare(b.p.name));
  const atStart=false;
  return `<div class="cal-head"><h2>${cap(mF.format(m).replace(' de ',' '))}</h2><div class="cal-tools"><button class="btn sm" data-act="excel">Descargar Excel</button><div class="arrows">
    <button class="arrow" data-act="rprev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="arrow" data-act="rnext" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button></div></div></div>
  <div class="tbl"><table class="tl"><thead><tr><th class="nm">Persona</th>${ks.map(k=>`<th class="${isWk(k)?'wk':''} ${S.hol[k]?'hl':''}">${L[P(k).getDay()]}<br>${+k.slice(8)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="legend"><span><i class="c-v"></i>Vacaciones</span><span><i class="c-am"></i>Medio día</span><span><i class="c-pe"></i>En aprobación</span><span><i class="c-pr"></i>Permiso</span><span><i class="c-bd"></i>Cumpleaños</span><span><i style="background:#F3EAF6"></i>Feriado</span></div>
  <div class="section"><h2>Quién sale este mes</h2><ul class="rows">${out.map(o=>`<li><div class="main"><strong>${esc(o.p.name)}</strong><p>${esc(o.p.dept||'Sin departamento')}</p></div><span>${o.label}</span>${o.t!=null?`<span class="amt">${dias(o.t)}</span>`:''}${o.pend?'<span class="pill jefatura">En aprobación</span>':''}</li>`).join('')||'<li><p class="empty">Nadie tiene días libres este mes.</p></li>'}</ul></div>`;
}

/* ---------- Mensaje de Teams con botones (la página lo arma; el flujo solo lo envía) ---------- */
function teamClash(u,ks){if(!u.boss)return[];const set=new Set(ks),out=[];
  S.people.filter(p=>p.id!==u.id&&p.boss===u.boss).forEach(p=>{const hit=[];S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status))r.days.forEach(d=>{if(set.has(d.k))hit.push(d.k)})});if(hit.length)out.push(`${p.name} (${hit.sort().map(fD).join(', ')})`)});return out}
function card(u,what,facts,clash,forRH){
  const body=[
    {type:'TextBlock',text:forRH?'Aprobación de RH':'Solicitud por aprobar',size:'Small',isSubtle:true},
    {type:'TextBlock',text:`${u.name} pide ${what}`,weight:'Bolder',size:'Medium',wrap:true},
    {type:'FactSet',facts:facts.filter(f=>f[1]).map(([title,value])=>({title,value:String(value)}))}];
  if(clash.length)body.push({type:'TextBlock',text:`⚠ Esos días también sale: ${clash.join('; ')}`,wrap:true,color:'Warning'});
  if(forRH)body.push({type:'TextBlock',text:'Ya la aprobó su jefatura.',wrap:true,isSubtle:true});
  return JSON.stringify({type:'AdaptiveCard',$schema:'http://adaptivecards.io/schemas/adaptive-card.json',version:'1.4',body,
    actions:[{type:'Action.Submit',title:'Aprobar',id:'Aprobar',style:'positive'},{type:'Action.Submit',title:'Rechazar',id:'Rechazar',style:'destructive'}]});
}

/* ---------- Importar la lista copiada del prototipo o de Excel ---------- */
function parseDate(s){s=String(s||'').trim();let m;
  if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(s)){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12){[d,mo]=[mo,d]}return `${y}-${pad(mo)}-${pad(d)}`}
  return ''}
function parseBday(s){s=String(s||'').trim();let m;
  if(m=/^(\d{1,2})-(\d{1,2})$/.exec(s))return `${pad(m[1])}-${pad(m[2])}`;
  const d=parseDate(s);return d?d.slice(5):''}
function parseImport(txt){
  const rows=txt.split(/\r?\n/).map(l=>l.split('\t')).filter(r=>r.some(c=>c.trim()));
  let dispMode=false;if(rows.length&&/nombre/i.test(rows[0][0])){dispMode=/disponible/i.test(rows[0][7]||'');rows.shift()}
  const raw=rows.map(r=>({name:(r[0]||'').trim(),email:lc(r[1]),dept:(r[2]||'').trim(),role:ROLE_IN[(r[3]||'').trim()]||'colab',bossName:(r[4]||'').trim(),
    start:parseDate(r[5])||TK,bday:parseBday(r[6]),prior:parseFloat(String(r[7]||'0').replace(',','.'))||0})).map(x=>dispMode?{...x,prior:earnedFrom(x.start)-x.prior}:x);
  const byName=n=>{n=lc(n);return raw.find(x=>lc(x.name)===n)?.email||S.all.find(p=>lc(p.name)===n)?.email||''};
  return raw.map(x=>({...x,boss:x.bossName?byName(x.bossName):'',skip:!x.email?'sin correo':S.all.some(p=>p.email===x.email)?'ya existe':''}));
}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar el generador de Excel'));document.head.appendChild(s)})}
const ESTADO_TXT={jefatura:'Con jefatura',rh:'Con RH',ok:'Aprobada',no:'Rechazada',cancel:'Cancelada'};
const PARTE_TXT={full:'Día completo',am:'Mañana (8 a 12)',pm:'Tarde (1 a 5)'};
const xd=k=>k?new Date(k+'T12:00:00'):'';
async function downloadExcel(){
  try{toast('Preparando Excel…');await loadXLSX()}catch(e){toast(e.message);return}
  const ppl=[...S.all].sort((a,b)=>(a.dept||'').localeCompare(b.dept||'')||a.name.localeCompare(b.name));
  const saldos=ppl.map(p=>{const b=bal(p.id),sg=S.reqs.filter(r=>r.emp===p.id&&r.status==='ok').reduce((s,r)=>s+(r.unpaid||0),0);
    return{'Nombre':p.name,'Correo':p.email,'Departamento':p.dept||'','Perfil':ROLE_OUT[p.role]||'','Jefatura':who(p.boss)?.name||p.boss||'','Activo':p.active?'Sí':'No',
      'Fecha de ingreso':xd(p.start),'Días ganados':b.earned,'Días tomados':b.taken,'En aprobación':b.pending,'Disponibles':b.avail,'Días sin goce (aprobados)':sg,'Horas por reponer':owed(p.id)}});
  const vac=[];

    let paidLeft=total(days)-(r.unpaid||0);
    days.forEach(d=>{const v=dv(d.p),paid=Math.max(0,Math.min(v,paidLeft));paidLeft-=paid;
      vac.push({'Nombre':p?.name||r.emp,'Departamento':p?.dept||'','Fecha':xd(d.k),'Tipo':PARTE_TXT[d.p]||d.p,'Días':v,'Con goce':paid,'Sin goce':v-paid,'Estado':ESTADO_TXT[r.status]||r.status})})});
  vac.sort((a,b)=>a.Fecha-b.Fecha||a.Nombre.localeCompare(b.Nombre));
  const perm=S.perms.filter(x=>x.status!=='no'&&x.status!=='cancel').map(x=>{const p=who(x.emp);return{'Nombre':p?.name||x.emp,'Departamento':p?.dept||'','Fecha':xd(x.k),
    'Horario':`${hhmm(x.start)} a ${hhmm(x.start+x.hours)}`,'Horas':x.hours,'Motivo':x.motive,'Repone':xd(x.repK),'Hora reposición':`${hhmm(x.repStart)} a ${hhmm(x.repStart+x.hours)}`,'Repuesto':x.repaid?'Sí':'No','Estado':ESTADO_TXT[x.status]||x.status}}).sort((a,b)=>a.Fecha-b.Fecha);
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(cols.map(c=>[c,'']))],{header:cols,dateNF:'dd/mm/yyyy'});ws['!cols']=cols.map(c=>({wch:Math.max(12,c.length+2,...rows.slice(0,200).map(r=>String(r[c]??'').length+1))}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(saldos,'Saldos',['Nombre','Correo','Departamento','Perfil','Jefatura','Activo','Fecha de ingreso','Días ganados','Días tomados','En aprobación','Disponibles','Días sin goce (aprobados)','Horas por reponer']);
  add(vac,'Vacaciones por día',['Nombre','Departamento','Fecha','Tipo','Días','Con goce','Sin goce','Estado']);
  add(perm,'Permisos',['Nombre','Departamento','Fecha','Horario','Horas','Motivo','Repone','Hora reposición','Repuesto','Estado']);
  XLSX.writeFile(wb,`Vacaciones y permisos ${TK}.xlsx`);toast('Excel descargado.');
}

/* ---------- Saldo al cargar una persona: RH puede poner "disponibles hoy" o "ya tomados" ---------- */
const apInSystem=p=>p?S.reqs.filter(r=>r.emp===p.id&&r.status==='ok').reduce((s,r)=>s+total(r.days)-(r.unpaid||0),0):0;
function daysField(pre,p){
  const val=p?num(bal(p.id).avail).replace(',','.'):'';
  return `<label class="f"><span>Saldo de vacaciones</span><select id="${pre}Mode" data-calc="${pre}"><option value="disp">Días disponibles hoy</option><option value="tom">Días ya tomados</option></select></label>
  <label class="f"><span>Días</span><input type="number" step="0.5" id="${pre}Days" data-calc="${pre}" value="${val}" placeholder="Ej.: 15.5"></label>
  <p class="small muted" id="${pre}Calc" style="grid-column:1/-1;margin:0">${calcText(pre,p)}</p>`;
}
function calcParts(pre,p){
  const g=id=>document.getElementById(id);
  const start=g(pre+'Start')?.value||p?.start||TK,mode=g(pre+'Mode')?.value||'disp',raw=g(pre+'Days')?.value;
  const earned=earnedFrom(start),ap=apInSystem(p);
  if(raw===''||raw==null)return{earned,ap,prior:p?p.prior:0,avail:earned-(p?p.prior:0)-ap,empty:true};
  const n=parseFloat(String(raw).replace(',','.'))||0;
  const prior=mode==='tom'?n:earned-n-ap;
  return{earned,ap,prior,avail:earned-prior-ap};
}
function calcText(pre,p){
  const c=calcParts(pre,p);
  if(c.empty&&!p)return 'Escribe los días disponibles hoy o los ya tomados; el otro número se calcula solo con la fecha de ingreso.';
  return `Desde su ingreso ha ganado <strong>${dias(c.earned)}</strong>. Tomados antes del sistema: <strong>${dias(c.prior)}</strong>${c.ap?`, más ${dias(c.ap)} aprobados en el sistema`:''}. Disponibles hoy: <strong>${dias(c.avail)}</strong>.${c.prior<0?' <span class="tagx">Tiene más días de los que ha ganado</span>':''}`;
}

    case'rm':V.sel.delete(a.dataset.k);paint();renderPick();break;
    case'sendVac':sendVac();break;
    case'sendPerm':sendPerm();break;
    case'cancelReq':case'cancelPerm':{if(!armed(a,'¿Seguro? Toca otra vez'))return;const x=findX(id);
      act(()=>setItem(x.id[0]==='V'?'solicitudes':'permisos',x.spId,{Estado:'Cancelada'}),'Cancelada.');break}
    case'yes':decide(id,true);break;
    case'no':V.rejecting=id;render();document.getElementById('why')?.focus();break;
    case'noCancel':V.rejecting=null;render();break;
    case'noOk':decide(id,false,(val('why')||'').trim());break;
    case'repaid':act(()=>Promise.all(owedL(emp).map(x=>setItem('permisos',x.spId,{Repuesto:true}))),`${who(emp).name} quedó al día.`);break;
    case'repaidOne':act(()=>setItem('permisos',findX(id).spId,{Repuesto:true}),'Marcado como repuesto.');break;
    case'exportToggle':V.exporting=!V.exporting;V.importing=false;render();break;
    case'importToggle':V.importing=!V.importing;V.exporting=false;render();break;
    case'importPreview':{V.importRows=parseImport(val('imp')||'');V.importText=val('imp')||'';render();break}
    case'importGo':{const rows=(V.importRows||[]).filter(r=>!r.skip);if(!rows.length)return;
      act(async()=>{let n=0;for(const r of rows){await addItem('personal',personFields(r));n++;toast(`Agregando ${n} de ${rows.length}…`)}
        V.importing=false;V.importRows=null;V.importText=''},`${rows.length} personas agregadas.`);break}
    case'copyTsv':{const t=document.getElementById('tsv');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>toast('Lista copiada.'),()=>toast('Selecciona el texto y copia con Ctrl+C.'))}else toast(ok?'Lista copiada.':'Selecciona el texto y copia con Ctrl+C.');break}
    case'addToggle':V.adding=!V.adding;if(!V.adding)clearDraft();render();break;
    case'addPerson':{const name=(val('nName')||'').trim(),email=lc(val('nEmail'));
      if(!name||!email){toast('Escribe el nombre y el correo.');return}
      if(S.all.some(p=>p.email===email)){toast('Ya existe una persona con ese correo.');return}
      act(()=>addItem('personal',personFields({name,email,dept:(val('nDept')||'').trim(),bday:readBday('n'),role:val('nRole'),boss:val('nBoss')||'',start:val('nStart')||TK,prior:readPrior('n',null)})),`${name} agregado.`).then(()=>{if(S.all.some(p=>p.email===email)){V.adding=false;clearDraft()}render()});break}
    case'open':V.person=emp;render();break;
    case'closePerson':V.person=null;clearDraft();render();break;
    case'savePerson':{const p=who(emp),email=lc(val('eEmail'))||p.email;
      if(email!==p.email&&S.all.some(o=>o.email===email)){toast('Ya existe una persona con ese correo.');return}
      act(async()=>{await setItem('personal',p.spId,personFields({name:(val('eName')||'').trim()||p.name,email,dept:(val('eDept')||'').trim(),bday:readBday('e'),role:val('eRole'),boss:val('eBoss')||'',start:val('eStart')||p.start,prior:readPrior('e',p),active:p.active}));
        if(email!==p.email)V.person=email;clearDraft()},'Cambios guardados.');break}
    case'delPerson':{const p=who(emp);if(!armed(a,`¿Seguro? Toca otra vez para desactivar a ${p.name}`))return;
      act(async()=>{await setItem('personal',p.spId,{Activo:false});V.person=null},`${p.name} quedó desactivado. Su historial se conserva.`);break}
    case'reactivate':{const p=who(emp);act(()=>setItem('personal',p.spId,{Activo:true}),`${p.name} está activo de nuevo.`);break}
    case'toggleInactive':V.showInactive=!V.showInactive;render();break;
    case'addDay':{const k=val('aDay'),part=val('aPart');if(!k){toast('Elige una fecha.');return}if(!isBiz(k)){toast('Esa fecha es fin de semana o feriado.');return}
      const p=who(emp),conf=!!p.boss,me_=me(),b=bal(p.id),unpaid=Math.max(0,dv(part)-Math.max(0,b.free));
      const facts=[['Día',`${fD(k)} (${PARTE_TXT[part]||part})`],['Total',dias(dv(part))],['Sin goce',unpaid?dias(unpaid):''],['Saldo actual',dias(b.avail)],['Saldo restante',dias(b.avail-(dv(part)-unpaid))],['Registrado por',me_.name]];
      const cardJ=JSON.parse(card(p,'vacaciones',facts,[],false));cardJ.body[0].text='Registro de RH por confirmar';cardJ.body[1].text=`RH registró vacaciones para ${p.name}`;
      cardJ.body.push({type:'TextBlock',text:'Confirma si esta persona tomó o tomará este día de vacaciones.',wrap:true,isSubtle:true});
      act(()=>addItem('solicitudes',{Title:`${p.name}: registro de RH ${fD(k)} (${dias(dv(part))})`,JefaturaCorreo:p.boss||'',RequiereRH:false,EmpleadoCorreo:p.email,Desde:wd(k),Hasta:wd(k),TotalDias:dv(part),
        Dias:JSON.stringify([{k,p:part}]),Estado:conf?'Jefatura':'Aprobada',Nota:'Registrado por RH',DiasSinGoce:unpaid,
        Detalle:`Registrado por RH (${me_.name})<br>Día: ${fD(k)} (${PARTE_TXT[part]||part})${unpaid?`<br>Incluye ${dias(unpaid)} sin goce de salario`:''}<br>Saldo restante: ${dias(b.avail-(dv(part)-unpaid))}`,TarjetaJefatura:conf?JSON.stringify(cardJ):''}),
        conf?`Registrado. Se envió a ${who(p.boss)?.name||'la jefatura'} para confirmar.`:'Día registrado.');break}
    case'delReq':{if(!armed(a,'¿Seguro? Toca otra vez'))return;act(()=>delItem('solicitudes',findX(id).spId),'Eliminado.');break}
    case'delPerm':{if(!armed(a,'¿Seguro? Toca otra vez'))return;act(()=>delItem('permisos',findX(id).spId),'Eliminado.');break}
    case'addHol':{const k=val('hDay'),n=(val('hName')||'').trim();if(!k||!n){toast('Escribe la fecha y el nombre.');return}if(S.hol[k]){toast('Ya hay un feriado en esa fecha.');return}
      act(()=>addItem('feriados',{Title:n,Fecha:wd(k)}),'Feriado agregado.');break}
    case'delHol':{if(!armed(a,'¿Seguro?'))return;act(()=>delItem('feriados',S.holIds[a.dataset.k]),'Feriado eliminado.');break}
    case'loadHol':{const miss=Object.entries(DEFAULT_HOL).filter(([k])=>k>=K(new Date(TODAY.getFullYear(),0,1))&&!S.hol[k]);
      act(async()=>{for(const [k,n] of miss)await addItem('feriados',{Title:n,Fecha:wd(k)})},`${miss.length} feriados agregados.`);break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='vnote'){V.vnote=e.target.value;return}
  const k=e.target.dataset?.pf;if(!k)return;V.pf[k]=(k==='start'||k==='repStart')?+e.target.value:e.target.value;if(k==='motive'){render();return}const[ok,msg]=pCheck(V.pf),pv=document.getElementById('pprev');if(pv){pv.innerHTML=msg;pv.className='preview'+(ok?'':' bad')}const ps=document.getElementById('psend');if(ps)ps.disabled=!ok});
document.addEventListener('change',e=>{if(e.target.id==='teamView'){V.team=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.picker){V.picker=null;render()}});
/* ---------- No perder lo que se está escribiendo ----------
   1) Los refrescos automáticos guardan y devuelven lo escrito en los formularios.
   2) Además se guarda un borrador en esta pestaña del navegador, por si la página se recarga. */
const FORM_SEL='#app input[id],#app select[id],#app textarea[id]';
function snapForm(){const o={};document.querySelectorAll(FORM_SEL).forEach(el=>{if(el.type!=='file')o[el.id]=el.type==='checkbox'?el.checked:el.value});return o}
function restoreForm(o){if(!o)return;Object.entries(o).forEach(([id,v])=>{const el=document.getElementById(id);if(!el)return;if(el.type==='checkbox')el.checked=v;else el.value=v});
  ['n','e'].forEach(pre=>{const c=document.getElementById(pre+'Calc');if(c&&typeof calcText==='function')c.innerHTML=calcText(pre,pre==='e'?who(V.person):null)})}
function softRefresh(){const ae=document.activeElement,focusId=ae&&ae.id,snap=snapForm();
  return loadAll().then(()=>{render();restoreForm(snap);if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{const n=el.value.length;el.setSelectionRange&&el.setSelectionRange(n,n)}catch(e){}}}}).catch(()=>{})}
const DKEY='gg-vac-borrador';
function draftCtx(){return V.adding?'add':V.person?'edit:'+V.person:V.importing?'imp':V.tab==='fer'?'fer':''}
function saveDraft(){try{const ctx=draftCtx();if(!ctx)return;sessionStorage.setItem(DKEY,JSON.stringify({ctx,tab:V.tab,adding:V.adding,person:V.person,importing:V.importing,vals:snapForm()}))}catch(e){}}
function clearDraft(){try{sessionStorage.removeItem(DKEY)}catch(e){}}
function loadDraft(){try{return JSON.parse(sessionStorage.getItem(DKEY)||'null')}catch(e){return null}}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#app'))saveDraft()});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#app'))saveDraft()});
/* Cada 2 minutos actualiza los datos, sin borrar lo escrito */
setInterval(()=>{const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(document.visibilityState==='visible'&&me()&&!busy&&!typing&&!V.picker&&!drag&&!V.sel.size)softRefresh()},120e3);
/* Al volver a la pestaña, actualiza si pasó más de un minuto, sin borrar lo escrito */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me()&&!busy&&!drag&&Date.now()-G.loadedAt>60e3)softRefresh()});

function setupMe(){const val=s=>document.getElementById(s)?.value,name=(val('sName')||'').trim(),start=val('sStart');if(!name||!start){toast('Escribe tu nombre y fecha de ingreso.');return}
  act(async()=>{await addItem('personal',personFields({name,email:V.user,dept:(val('sDept')||'').trim(),role:'rh',boss:'',start,prior:+val('sPrior')||0,bday:''}));V.team='all'},'Listo. Ya estás registrado como RH.')}
/* ---------- Pantallas de inicio ---------- */
function screen(html){app.innerHTML=`<div class="gate">${html}</div>`}
function showUser(){const el=document.getElementById('whoami');el.innerHTML=G.me?`<span>${esc(G.me.displayName||V.user)}</span><button class="btn sm" data-logout>Salir</button>`:''}
function setupScreen(){
  screen(`<h1>Configuración inicial</h1><p>Todavía no hay nadie en la lista de Personal. Regístrate como RH para empezar; después agregas al resto desde la pestaña Personal.</p>
  <div class="formrow" style="text-align:left">
    <label class="f"><span>Tu nombre</span><input id="sName" value="${esc(G.me.displayName||'')}"></label>
    <label class="f"><span>Correo</span><input value="${esc(V.user)}" disabled></label>
    <label class="f"><span>Departamento</span><input id="sDept" value="Recursos Humanos"></label>
    <label class="f"><span>Fecha de ingreso</span><input type="date" id="sStart"></label>
    <label class="f"><span>Días ya tomados</span><input type="number" step="0.5" min="0" id="sPrior" value="0"></label>
    <button class="btn primary" data-act="setupMe">Registrarme como RH</button></div>`);
}
async function boot(){
  screen('<p class="muted">Cargando…</p>');
  if(!window.isSecureContext||!window.crypto?.subtle){
    if(location.protocol==='http:'&&location.hostname!=='localhost'){location.replace('https://'+location.host+location.pathname+location.search);return}
    screen(`<h1>Esta página necesita una conexión segura</h1><p>Ábrela con una dirección que empiece con <strong>https://</strong>. Si acabas de configurar el dominio, GitHub puede tardar un rato en activar el certificado seguro.</p>`);return}
  try{await initAuth()}catch(e){console.error(e);screen(`<h1>No se pudo iniciar sesión</h1><p>${esc(e.message)}</p>`);return}
  if(!G.account){screen(`<h1>Vacaciones y permisos</h1><p>Entra con tu cuenta de trabajo de Microsoft, la misma de Outlook y Teams.</p><button class="btn primary" data-login>Iniciar sesión</button>`);return}
  try{await connect();showUser();await loadAll()}
  catch(e){console.error(e);if(e.message==='redirect')return;showUser();
    screen(e.status===403||e.status===401?`<h1>Todavía no tienes acceso</h1><p>Tu cuenta entró bien, pero aún no tiene permiso para ver los datos de vacaciones. Pide a RH que te dé acceso.</p>`
      :`<h1>No se pudieron cargar los datos</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Intentar de nuevo</button>`);return}
  if(!S.all.length){setupScreen();return}
  {const ids=[lc(G.me.mail),lc(G.me.userPrincipalName)].filter(Boolean);const m=S.all.find(p=>ids.includes(p.id));if(m)V.user=m.id}
  if(!me()){screen(`<h1>Tu cuenta no está registrada</h1><p>Entraste como <strong>${esc(V.user)}</strong>, pero ese correo no está en la lista de Personal${S.all.some(p=>p.email===V.user)?' o está desactivado':''}. Pide a RH que te agregue.</p>`);return}
  V.team=me().role==='rh'?'all':'team';
  const dr=loadDraft();
  if(dr&&me().role==='rh'){V.tab=dr.tab||V.tab;V.adding=!!dr.adding;V.person=dr.person&&who(dr.person)?dr.person:null;V.importing=!!dr.importing}
  render();
  if(dr&&me().role==='rh'&&dr.ctx===draftCtx()){restoreForm(dr.vals);toast('Recuperamos lo que estabas escribiendo.')}
}
boot();

</script>
</body>
</html>
