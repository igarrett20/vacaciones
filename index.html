<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacaciones y permisos | Grupo Garrett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#0D6174; --brand-dark:#0A4E5D; --brand-soft:#E4F0F2;
  --ink:#1B2A33; --muted:#66737C; --line:#E2E7EA; --line-strong:#C9D1D6; --sunk:#F6F8F9;
  --pend:#A86C12; --pend-soft:#FBF1DC; --danger:#B3242D; --danger-soft:#FBE7E8; --hol:#8A4F9E; --bday:#C2255C; --bday-soft:#FCEAF1;
  --font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{background:#fff;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
.muted{color:var(--muted)}.small{font-size:13px}

/* Header */
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{width:auto;padding:6px 8px}
.bell{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px}
.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px}
.bell i:empty{display:none}
.test{padding:7px 28px;font-size:13px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.test button{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}

main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}

/* Stats */
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;margin-bottom:26px}
.stat{flex:1 1 200px;padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.stat.main strong{color:var(--brand);font-size:30px}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat .owe{color:var(--pend)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--pend);color:#fff;font-size:12px;margin-left:6px;padding:0 6px}

/* Buttons */
.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.lnk.red{color:var(--danger)}
.lnk:hover{text-decoration:underline}
.wide{width:100%}

/* Vacaciones */
.vac{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{margin:0;font-size:19px}
.arrows{display:flex;gap:6px}
.arrow{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
.arrow[disabled]{opacity:.3;cursor:default}
.arrow svg{width:18px;height:18px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.grid{touch-action:none;user-select:none;-webkit-user-select:none}
.day{appearance:none;position:relative;height:58px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:6px 8px;text-align:left;font-weight:600;font-size:14px;display:flex;flex-direction:column;justify-content:space-between}
.day em{font-style:normal;font-size:11px;font-weight:600;line-height:1.1}
.day:hover:not([aria-disabled="true"]){border-color:var(--brand)}
.day[aria-disabled="true"]{cursor:default}
.day.off{border-color:transparent;background:var(--sunk);color:#AAB4BA;font-weight:500}
.day.hol{border-color:transparent;color:var(--hol);background:repeating-linear-gradient(-45deg,#fff 0 5px,#F3EAF6 5px 8px)}
.day.bday{background:var(--bday-soft);border-color:var(--bday);color:var(--bday)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.ok{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.day.pend{background:var(--pend-soft);border:1.5px dashed var(--pend);color:var(--pend)}
.day.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.day.half.sel{background:linear-gradient(135deg,var(--brand) 50%,#9CC6CF 50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{margin-bottom:6px}
.pick{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow-y:auto}
.pick li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pick .d{flex:1;font-size:14px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--danger);background:var(--danger-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--brand);color:#fff}
.seg.lg button{padding:8px 18px;font-size:14px}
.sum{display:flex;justify-content:space-between;padding:12px 0;margin-top:4px;border-top:1px solid var(--line);font-size:14px}
.sum strong{font-size:16px}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Lists */
.section{margin-top:34px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows .main{flex:1;min-width:200px}
.rows .main p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rows .amt{font-weight:600;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:12px 0;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.jefatura,.pill.rh{background:var(--pend-soft);color:var(--pend)}
.pill.ok{background:var(--brand-soft);color:var(--brand)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.tagx.adv{color:var(--brand);background:var(--brand-soft)}
.warn.soft.adv{background:var(--brand-soft);color:var(--ink);border-color:var(--brand)}
.neg{color:var(--danger)}
.xrange{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.xrange label{display:flex;align-items:center;gap:6px}
.xrange input{width:auto;padding:5px 8px;font-size:13px}
.pill.cancel{background:var(--sunk);color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:700;margin-left:2px;opacity:.75}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.kind{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;margin-right:8px;vertical-align:1px}
.kind.v{background:var(--brand-soft);color:var(--brand)}
.kind.p{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.acts{display:flex;gap:8px;align-items:center}
.acts input{width:190px}

/* Permisos */
.perm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.f{display:grid;gap:5px;margin-bottom:14px}
.f>span{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:14px}
.preview.bad{background:var(--danger-soft);color:var(--danger)}

/* Tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
.num{text-align:right}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.formrow .f{margin:0}
.calc{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 18px}
.back{margin-bottom:14px}

/* Drawer + toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.notes{list-style:none;margin:0;padding:6px 20px;overflow-y:auto;flex:1}
.notes li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes p{margin:4px 0 0}
.ch{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;background:var(--brand-soft);color:var(--brand)}
.ch.Outlook{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Resumen */
.dept-h{font-size:14px;font-weight:700;color:var(--brand);margin:22px 0 6px}
.tl{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.tl th,.tl td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.tl th{height:34px;min-width:26px;font-size:11px;line-height:1.1;color:var(--muted);border-bottom:1px solid var(--line-strong)}
.tl th.nm,.tl td.nm{position:sticky;left:0;background:#fff;text-align:left;padding:0 12px 0 2px;min-width:140px;white-space:nowrap;font-size:13px;z-index:1}
.tl td.nm{font-weight:600}
.tl tr.dh td{background:var(--sunk);color:var(--brand);font-weight:700;text-align:left;padding:6px 4px;font-size:12px;position:sticky;left:0}
.tl td.c{height:30px;min-width:26px;border-left:1px solid #F0F3F4}
.tl .wk{background:var(--sunk)}
.tl .hl{background:#F3EAF6}
.tl .td{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tl i{display:block;margin:4px 2px;height:20px;border-radius:4px}
.c-v{background:var(--brand)}
.c-am{background:linear-gradient(135deg,var(--brand) 50%,var(--brand-soft) 50%)}
.c-pm{background:linear-gradient(135deg,var(--brand-soft) 50%,var(--brand) 50%)}
.c-pe{background:var(--pend-soft);border:1.5px dashed var(--pend)}
.c-pr{background:#E8E1F6;border:1px solid #6A4FB6}
.c-bd{background:var(--bday-soft);border:1px solid var(--bday)}
.mail-note{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:18px}
/* Sin goce, acumulado, equipo, selector de fecha */
.warn.soft{background:var(--pend-soft);color:#6E4608}
.tagx{font-size:11px;font-weight:700;color:var(--pend);background:var(--pend-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--pend-soft);color:#6E4608;border-radius:10px;padding:12px 14px;font-size:14px;margin:-6px 0 22px}
.alert strong{color:#5A3905}
.alert svg{flex:none;width:18px;height:18px;margin-top:1px}
.hi{color:var(--pend);font-weight:700}
.cal-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-tools select{width:auto;padding:6px 8px;font-size:13px}
.grid.team .day{height:84px}
.day .ppl{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.day .ppl b{font-size:10px;font-weight:600;line-height:1.3;padding:0 4px;border-radius:4px;background:#DCEBEF;color:var(--brand-dark);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ppl b.p{background:#fff;border:1px dashed var(--pend);color:var(--pend)}
.day .ppl b.more{background:var(--ink);color:#fff}
.day.sel .ppl b{background:#fff;color:var(--brand-dark)}
.day em{margin-top:2px}
.clash{font-size:13px;color:var(--pend);margin:4px 0 0}
.datebtn{appearance:none;width:100%;text-align:left;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.datebtn:hover{border-color:var(--brand)}
.datebtn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.pickwrap{position:relative}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:280px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(20,40,50,.16)}
.pop .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.pop .arrow{width:30px;height:30px}
.pop .dow,.pop .pg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pop .dow span{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.pop .pg button{appearance:none;border:0;background:none;height:32px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.pop .pg button:hover:not([disabled]){background:var(--brand-soft)}
.pop .pg button[disabled]{color:#C3CBD0;cursor:default;font-weight:400}
.pop .pg button.on{background:var(--brand);color:#fff}
.pop .pg button.hol{color:var(--hol)}
@media (max-width:860px){
  .grid.team .day{height:64px}
  .day .ppl b:not(.more){display:none}
  .top{padding:12px 16px}.test{padding:7px 16px}
  .top .app-name{display:none}
  main{padding:20px 14px 60px}
  .vac,.perm{grid-template-columns:1fr}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .day{height:48px;padding:4px 5px}
  .day em{display:none}
  .acts{width:100%}.acts input{flex:1;width:auto}
}
/* Inicio y estado */
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate h1{margin-bottom:10px}
.gate p{color:var(--muted);margin:0 0 20px}
.gate .formrow{text-align:left}
body.busy{cursor:progress}
body.busy .btn,body.busy .lnk{pointer-events:none;opacity:.6}
#whoami{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
a.btn{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Secciones grandes */
.welcome{margin:-6px 0 18px;color:var(--muted);font-size:15px}
.secsw{display:flex;gap:8px;margin:-4px 0 22px;flex-wrap:wrap}
.secsw button{appearance:none;font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;color:var(--muted);cursor:pointer}
.secsw button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.soon{border:1px dashed var(--line-strong);border-radius:14px;padding:40px 28px;text-align:center;color:var(--muted)}
.soon h2{color:var(--ink);margin:0 0 8px;font-size:20px}
/* Panel de RH */
.dfil{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.dfil label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.dfil select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink);min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi strong{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi.warn strong{color:var(--pend)}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;min-width:0}
.dcard.w2{grid-column:span 2}.dcard.w3{grid-column:1/-1}
.dcard h3{margin:0;font-size:15px;font-weight:700}
.dcard .sub{margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:none}
.dleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;flex:1}
.dleg li{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:8px}
.bars svg,.rank svg{width:100%;height:auto;display:block}
.bleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.bleg span{display:flex;align-items:center;gap:6px}.bleg i{width:10px;height:10px;border-radius:3px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wday{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:90px}
.wday.td{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.wday h4{margin:0 0 6px;font-size:13px;font-weight:700}
.wday ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.wday li{display:flex;gap:6px;align-items:baseline}
.wday li i{width:7px;height:7px;border-radius:2px;flex:none;transform:translateY(-1px)}
.wday .none{color:var(--muted)}
/* Detalle desplegable de reposiciones pendientes */
.dmore{appearance:none;font:inherit;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:0;border-radius:999px;padding:6px 12px;margin-top:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dmore:hover{background:#D3E7EB}
.dmore svg{width:14px;height:14px;transition:transform .35s ease}
.dmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.repx{grid-column:1/-1;display:grid;grid-template-rows:0fr;margin-top:-14px;
  clip-path:circle(var(--r0,60px) at var(--cx,16%) var(--cy,-110px));
  transition:clip-path .55s cubic-bezier(.55,0,.75,.2),grid-template-rows .45s cubic-bezier(.4,0,.2,1) .42s,margin-top .45s cubic-bezier(.4,0,.2,1) .42s}
.repx.open{grid-template-rows:1fr;margin-top:0;clip-path:circle(var(--r1,3000px) at var(--cx,16%) var(--cy,-110px));
  transition:clip-path .85s cubic-bezier(.22,.8,.25,1),grid-template-rows .55s cubic-bezier(.22,.8,.25,1),margin-top .55s cubic-bezier(.22,.8,.25,1)}
.repx>div{overflow:hidden;min-height:0}
.repx .inner{position:relative;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;overflow:hidden}
.repx .inner::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--cxi,16%) 0,#CFE6EB 0,#E4F0F2 40%,#fff 75%);opacity:0;pointer-events:none}
.repx.open .inner::before{animation:inkfade 1.1s ease-out .1s both}
.repx .inner>*{position:relative}
@keyframes inkfade{0%{opacity:1}100%{opacity:0}}
.donut .arcs{transform-origin:70px 70px}
.donut.burst .arcs{animation:spin .8s cubic-bezier(.3,.7,.2,1)}
.donut.burst svg{animation:pop .6s cubic-bezier(.3,.7,.2,1)}
.donut .ripple{fill:none;stroke:var(--brand);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.donut.burst .ripple{animation:ripple .75s ease-out}
@keyframes spin{from{transform:rotate(-120deg)}to{transform:rotate(0)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.repx h3{margin:0;font-size:15px;font-weight:700}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.rtab th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.rtab td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab tr:last-child td{border-bottom:0}
.rtab td small{display:block;color:var(--muted);font-size:12px}
.repx.open .rtab tbody tr{animation:rowin .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms + .15s)}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rst{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.rst.late{background:var(--pend-soft);color:#7A4E0D}.rst.next{background:var(--sunk);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.repx,.repx.open,.dmore svg{transition:none}.repx.open .rtab tbody tr,.repx.open .inner::before,.donut.burst .arcs,.donut.burst svg,.donut.burst .ripple{animation:none}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:1fr}.dcard.w2{grid-column:auto}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Políticas internas */
.secsw b{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--pend);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
.secsw button[aria-pressed="true"] b{background:#fff;color:var(--brand)}
.ph2{font-size:18px;font-weight:700;margin:0 0 12px}
.f textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pnote{background:var(--pend-soft);color:#5E3E0A;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .6s cubic-bezier(.22,.8,.25,1)}
.pbar.lg{height:10px;border-radius:5px}
.prog{display:flex;align-items:center;gap:10px}.prog .pbar{flex:1}.prog span{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptab{width:100%;border-collapse:collapse;font-size:14px}
.ptab th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-strong)}
.ptab td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptab td small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.ptab tr.click{cursor:pointer}.ptab tr.click:hover td{background:var(--sunk)}
.ptab .chev{color:var(--muted);font-size:20px;text-align:right;width:28px}
.psum{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:22px 0 10px}
.pbig strong{display:block;font-size:34px;font-weight:700;color:var(--brand);letter-spacing:-.02em;line-height:1}
.pbig span{font-size:13px;color:var(--muted)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{appearance:none;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.pchips button b{font-weight:700;color:var(--ink)}
.pchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.pchips button[aria-pressed="true"] b{color:#fff}
.pcards{display:grid;gap:12px}
.pcard{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:14px;padding:18px 20px;flex-wrap:wrap}
.pc-main{flex:1;min-width:240px}
.pcard h3{margin:0;font-size:16px}.pcard p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.pcard .pbar{max-width:360px;margin-top:8px}.pcard small{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
/* Lector */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rsteps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px;flex-wrap:wrap}
.rsteps li{flex:1;min-width:34px;max-width:90px;height:30px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);transition:background .3s,color .3s}
.rsteps li.done{background:var(--brand-soft);border-color:#B9DCE3;color:var(--brand)}
.rsteps li.cur{background:var(--brand);border-color:var(--brand);color:#fff}
.pdfv{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto;user-select:none;-webkit-user-select:none}
.pdfv .pg{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(27,42,51,.08);min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pdfv .pg span{color:var(--muted);font-size:13px}
.pdfv canvas{display:block;width:100%;height:auto;pointer-events:none}
.pdfend{max-width:860px;margin:14px auto 0;text-align:center;font-size:12.5px;color:var(--muted);padding:10px;border-top:1px dashed var(--line-strong)}
.rbar{position:sticky;bottom:0;z-index:5;margin:14px -4px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(27,42,51,.08)}
.rprog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:10px}.rprog i{display:block;height:100%;width:0;background:var(--brand);transition:width 1s linear}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rinfo{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.rinfo .ok{color:var(--brand);font-weight:600}.rinfo .ok::before{content:"✓ "}
.rinfo em{font-style:normal;color:var(--pend);font-weight:600}
.racts{display:flex;gap:8px;align-items:center}
.rfinal{max-width:560px;margin:10px auto;text-align:center;padding:28px}
.rfinal h3{margin:0 0 6px;font-size:18px}
.chk{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
@media print{body.reading>*{display:none!important}body.reading::after{content:"Este documento no se puede imprimir.";display:block;padding:40px;font:600 18px sans-serif}}
/* Capacitaciones */
.pnote.warn{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:18px 0 0}
.csteps li{max-width:160px;flex:1}
.vbox{max-width:900px;margin:0 auto;border-radius:12px;overflow:hidden;background:#0B1E25}
.vbox video{display:block;width:100%;max-height:70vh;background:#000}
.vframe{position:relative;padding-top:56.25%}.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{padding:60px 20px;text-align:center;color:#E4F0F2}.vlink p{margin:0 0 14px}
.qlist{display:flex;flex-direction:column;gap:14px;max-width:820px;margin:0 auto}
.qa{border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;margin:0}
.qa legend{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15.5px;font-weight:600;padding:0;margin-bottom:10px;width:100%}
.qa legend small{flex-basis:100%;font-weight:400;color:var(--muted);font-size:12.5px;margin-left:34px}
.qn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;flex:none}
.qopt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.qopt:hover{border-color:var(--line-strong)}.qopt.on{border-color:var(--brand);background:var(--brand-soft)}
.qopt input{width:18px;height:18px;accent-color:var(--brand);flex:none;margin:0}
.rfinal .big{font-size:44px;font-weight:700;margin:6px 0;color:var(--brand)}.rfinal.bad .big{color:var(--danger)}
.spin{width:36px;height:36px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin360 .9s linear infinite}
@keyframes spin360{to{transform:rotate(360deg)}}
.qedit{display:flex;flex-direction:column;gap:12px}
.qe{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.qe-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.qe-top select{width:auto;min-width:200px}.qe-top .lnk{margin-left:auto}
.qe textarea{font:inherit;width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;resize:vertical;margin-bottom:10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qo{display:flex;gap:10px;align-items:center}.qo>input[type=radio],.qo>input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex:none;margin:0}
.qo input[data-qo]{flex:1}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.aud{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:6px;background:var(--sunk)}
.aud-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.aud-h span#audN{font-size:13px;color:var(--muted)}
.aud-b{margin-left:auto;display:flex;gap:12px}
.aud-q{margin-bottom:10px}
.aud-list{max-height:280px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.aud-i{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px;cursor:pointer;min-width:0}
.aud-i[hidden]{display:none}.aud-i input{width:17px;height:17px;accent-color:var(--brand);flex:none;margin:0}

async function gx(method,path,body){

}

/* Lee fechas de SharePoint sin correrlas de día, tanto si la columna es "solo fecha" (medianoche local en UTC)

  const extra=Promise.all([opt('politicas'),opt('lecturas'),opt('capacitaciones'),opt('claves').catch(()=>[]),opt('avance')]);extra.catch(()=>{});

    boss:lc(f.JefaturaCorreo)||null,start:rd(f.FechaIngreso)||TK,prior:+f.DiasPrevios||0,

    company:f.Empresa||'',empNo:f.NumeroEmpleado!=null?String(f.NumeroEmpleado):'',unit:f.UnidadOperativa||''}}).filter(p=>p.id);
  const reqs=so.map(i=>{const f=i.fields;let days=[];try{days=JSON.parse(f.Dias||'[]')}catch(e){}
    if(!days.length&&f.Desde){let k=rd(f.Desde);const h=rd(f.Hasta)||k;while(k<=h){if(!isWk(k))days.push({k,p:'full'});k=addD(k,1)}}
    return{id:'V'+i.id,spId:i.id,emp:lc(f.EmpleadoCorreo),days,unpaid:+f.DiasSinGoce||0,note:f.Nota||'',status:EST_IN[f.Estado]||'jefatura',reason:f.Comentario||'',created:Date.parse(i.createdDateTime)||0}});
  const perms=pm.map(i=>{const f=i.fields;return{id:'P'+i.id,spId:i.id,emp:lc(f.EmpleadoCorreo),k:rd(f.Fecha),start:fromHHMM(f.HoraSalida),hours:+f.Horas||1,motive:f.Motivo||'',
    repK:rd(f.FechaReposicion),repStart:fromHHMM(f.HoraReposicion),rep2K:f.FechaReposicion2?rd(f.FechaReposicion2):null,rep2Start:f.HoraReposicion2?fromHHMM(f.HoraReposicion2):null,status:EST_IN[f.Estado]||'jefatura',repaid:f.Repuesto===true,boss:lc(f.JefaturaCorreo)||null,reason:f.Comentario||'',created:Date.parse(i.createdDateTime)||0}});
  const hol={},holIds={};fe.forEach(i=>{const k=rd(i.fields.Fecha);if(k){hol[k]=i.fields.Title||'Feriado';holIds[k]=i.id}});
  const keep=S?{pols:S.pols,reads:S.reads,caps:S.caps,keys:S.keys,adv:S.adv}:{};
  S={people,reqs,perms,hol,holIds,all:people,...keep};
  S.people=people.filter(p=>p.active);
  /* Reposiciones: cuenta como repuesto si lo confirmó su jefatura (o RH si la persona no tiene jefatura).
     Se valida con quien CREÓ la confirmación en SharePoint, no con lo que diga el texto. */
  const confs=rp.map(i=>({permId:String(i.fields.PermisoId??''),block:+i.fields.Bloque||1,by:lc(i.createdBy?.user?.email),byName:i.createdBy?.user?.displayName||'',at:rd(i.createdDateTime)}));
  perms.forEach(x=>{const sp=x.repaid;x.reps=repsOf(x);
    x.reps.forEach(b=>{b.conf=confs.find(c=>c.permId===String(x.spId)&&c.block===b.n&&confOK(c,x))||null;b.done=sp||!!b.conf});
    x.repaid=x.reps.length?x.reps.every(b=>b.done):sp;x.conf=x.reps.map(b=>b.conf).filter(Boolean).at(-1)||null});

/* ---------- Calendario de Outlook/Teams de cada persona ----------
   Con el permiso delegado Calendars.ReadWrite, la página pone en el calendario PROPIO de quien entra:
   sus vacaciones aprobadas, su día libre de cumpleaños, y sus permisos aprobados (el permiso y la reposición).
   Cada evento lleva una marca interna (clave) para no duplicarlo; si una solicitud se cancela o borra, se quita el evento. */
const CAL={scopes:['Calendars.ReadWrite'],cat:'Vacaciones y permisos',tz:'Central America Standard Time',
  prop:'String {6f1c2a4e-8b3d-4c7a-9e52-1d0b7a3f5c81} Name GGVacKey',running:false,off:false,sig:'',at:0};
async function cx(tk,method,path,body){
  const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method,headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json',Prefer:`outlook.timezone="${CAL.tz}"`},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;const j=await r.json().catch(()=>null);
  if(!r.ok)throw new GraphError(r.status,j?.error?.message||r.statusText);return j}
const tAt=(k,t)=>t>=24?addD(k,1)+'T00:00:00':`${k}T${hhmm(t)}:00`;
function calWanted(){
  const u=me();if(!u)return[];const out=[];
  S.reqs.filter(r=>r.emp===u.id&&r.status==='ok').forEach(r=>{
    runsOf([...r.days].sort((a,b)=>a.k.localeCompare(b.k)),u.id).forEach(g=>{let blk=[];
      const flush=()=>{if(!blk.length)return;const a=blk[0].k,b=blk.at(-1).k;
        out.push({key:`V${r.spId}|${a}|${b}`,subject:'Vacaciones',start:a+'T00:00:00',end:addD(b,1)+'T00:00:00',allDay:true,showAs:'oof'});blk=[]};
      g.forEach(d=>{if(d.p==='full'){blk.push(d);return}flush();const[h1,h2]=d.p==='am'?[8,12]:[13,17];
        out.push({key:`V${r.spId}|${d.k}|${d.p}`,subject:`Vacaciones (${d.p==='am'?'mañana':'tarde'})`,start:tAt(d.k,h1),end:tAt(d.k,h2),allDay:false,showAs:'oof'})});
      flush()})});
  if(u.bday){const y=TODAY.getFullYear();for(const k of [`${y}-${u.bday}`,`${y+1}-${u.bday}`]){if(K(P(k))!==k||k<TK||!isBiz(k))continue;
    out.push({key:`B|${k}`,subject:'Día libre por cumpleaños',start:k+'T00:00:00',end:addD(k,1)+'T00:00:00',allDay:true,showAs:'oof'});break}}
  S.perms.filter(x=>x.emp===u.id&&x.status==='ok').forEach(x=>{
    out.push({key:`P${x.spId}|${x.k}|${x.start}|${x.hours}`,subject:`Permiso (${x.hours} h)`,body:`Motivo: ${x.motive}. Repones ${repTxt(x)}.`,start:tAt(x.k,x.start),end:tAt(x.k,x.start+x.hours),allDay:false,showAs:'oof'});
    x.reps.forEach(b=>out.push({key:x.reps.length>1?`R${x.spId}|${b.n}|${b.k}|${b.start}|${b.h}`:`R${x.spId}|${b.k}|${b.start}|${x.hours}`,subject:`Reposición de permiso (${b.h} h)${x.reps.length>1?`, ${b.n} de 2`:''}`,body:`Repones el permiso del ${fD(x.k)}, ${fT(x.start)} a ${fT(x.start+x.hours)}.${x.reps.length>1?` Reposición en dos partes: ${repTxt(x)}.`:''}`,start:tAt(b.k,b.start),end:tAt(b.k,b.start+b.h),allDay:false,showAs:'busy'}))});
  return out.filter(e=>e.end>TK+'T00:00:00');
}
async function calSync(){
  if(CAL.running||CAL.off||!me())return;
  const want=calWanted(),sig=want.map(e=>e.key).sort().join(',');
  if(sig===CAL.sig&&Date.now()-CAL.at<30*60e3)return;
  CAL.running=true;
  try{
    let tk;try{tk=(await G.pca.acquireTokenSilent({scopes:CAL.scopes,account:G.account})).accessToken}
    catch(e){CAL.off=true;console.info('Calendario: falta el permiso Calendars.ReadWrite (consentimiento de administrador).',e);return}
    const wk=new Map(want.map(e=>[e.key,e])),have=new Set();
    let url=`/me/events?$filter=${encodeURIComponent(`categories/any(c:c eq '${CAL.cat}')`)}&$select=id,end&$expand=${encodeURIComponent(`singleValueExtendedProperties($filter=id eq '${CAL.prop}')`)}&$top=200`;
    while(url){const j=await cx(tk,'GET',url);
      for(const e of j.value){const key=e.singleValueExtendedProperties?.[0]?.value;if(!key)continue;
        if(wk.has(key)&&!have.has(key)){have.add(key);continue}
        if((e.end?.dateTime||'')>TK+'T00:00:00')await cx(tk,'DELETE',`/me/events/${e.id}`)}
      url=j['@odata.nextLink']||null}
    for(const e of want){if(have.has(e.key))continue;
      await cx(tk,'POST','/me/events',{subject:e.subject,body:{contentType:'text',content:(e.body?e.body+'\n\n':'')+'Agregado automáticamente por el sistema de vacaciones y permisos.'},
        start:{dateTime:e.start,timeZone:CAL.tz},end:{dateTime:e.end,timeZone:CAL.tz},isAllDay:e.allDay,showAs:e.showAs,categories:[CAL.cat],
        isReminderOn:false,responseRequested:false,singleValueExtendedProperties:[{id:CAL.prop,value:e.key}]})}
    CAL.sig=sig;CAL.at=Date.now();
  }catch(e){console.warn('Calendario: no se pudo sincronizar.',e)}
  finally{CAL.running=false}
}

/* ---------- Model ---------- */
const who=id=>(S.all||[]).find(p=>p.id===id);
const me=()=>S.people.find(p=>p.id===V.user);
const dv=p=>p==='full'?1:.5;
const total=d=>d.reduce((s,x)=>s+dv(x.p),0);
/* Acumulación: 1 día por cada mes cumplido desde la fecha de ingreso (ej.: entra el 16 de octubre, gana 1 día el 16 de noviembre, otro el 16 de diciembre...).
   Si el mes no tiene ese día (31, 30, 29), se gana el último día del mes. */
const POR_MES=1;
function monthiv(start,n){const s=P(start),y=s.getFullYear(),mo=s.getMonth()+n,dim=new Date(y,mo+1,0).getDate();return new Date(y,mo,Math.min(s.getDate(),dim))}
function accMonths(start,ref){ref=ref||TODAY;const s=P(start);let n=(ref.getFullYear()-s.getFullYear())*12+ref.getMonth()-s.getMonth();if(n>0&&monthiv(start,n)>ref)n--;return Math.max(0,n)}
const earnedFrom=start=>accMonths(start)*POR_MES;
function nextAccrual(start){return K(monthiv(start,accMonths(start)+1))}
function bal(id){
  const p=who(id);let ap=0,pe=0;
  S.reqs.forEach(r=>{if(r.emp!==id)return;const t=total(r.days)-(r.unpaid||0);if(r.status==='ok')ap+=t;else if(live(r.status))pe+=t});
  const earned=earnedFrom(p.start);const avail=earned-p.prior-ap;
  return{earned,taken:p.prior+ap,pending:pe,avail,free:avail-pe};
}
/* Reposición en bloques: un permiso de 2 h puede reponerse en dos partes de 1 h, cada una con su día y hora */
const repsOf=x=>x.rep2K?[{n:1,k:x.repK,start:x.repStart,h:1},{n:2,k:x.rep2K,start:x.rep2Start,h:1}]:x.repK?[{n:1,k:x.repK,start:x.repStart,h:x.hours}]:[];
const blkTxt=b=>`${fD(b.k)}, ${fT(b.start)} a ${fT(b.start+b.h)}`;
const repTxtB=r=>r.length>1?`1 hora el ${blkTxt(r[0])} y otra hora el ${blkTxt(r[1])}`:r[0]?blkTxt(r[0]):'';
const repTxt=x=>repTxtB(x.reps||repsOf(x));
/* Bloques de reposición a partir del formulario */
const fBlocks=f=>f.hours===2&&f.split?[{n:1,k:f.repK,start:f.repStart,h:1},{n:2,k:f.rep2K,start:f.rep2Start,h:1}]:[{n:1,k:f.repK,start:f.repStart,h:f.hours}];
const blkState=(x,b)=>x.status!=='ok'?'':b.conf?` (repuesta, confirmó ${esc(who(b.conf.by)?.name||b.conf.byName)} el ${fD(b.conf.at)})`:b.done?' (repuesta)':blkDue(x,b)?` (falta que ${esc(repWho(x))} confirme)`:'';
const nextBlk=x=>(x.reps||[]).find(b=>!b.done);
const owedL=id=>S.perms.filter(x=>x.emp===id&&x.status==='ok'&&!x.repaid&&x.reps?.length).sort((a,b)=>nextBlk(a).k.localeCompare(nextBlk(b).k));
const owed=id=>owedL(id).reduce((s,x)=>s+x.reps.filter(b=>!b.done).reduce((t,b)=>t+b.h,0),0);
function booked(id){const m=new Map();S.reqs.forEach(r=>{if(r.emp===id&&live(r.status))r.days.forEach(d=>m.set(d.k,{p:d.p,st:r.status}))});return m}
const isBday=(id,k)=>{const p=who(id);return !!(p&&p.bday&&p.bday===k.slice(5)&&isBiz(k))};
/* Corta días en tramos seguidos: fines de semana, feriados y el cumpleaños de la persona no cortan el tramo */
const runsOf=(ds,emp)=>{const out=[];ds.forEach(d=>{const g=out.at(-1);let nx=g&&g.at(-1).k;if(nx){nx=addD(nx,1);while(nx<d.k&&(!isBiz(nx)||isBday(emp,nx)))nx=addD(nx,1)}
  if(g&&nx===d.k)g.push(d);else out.push([d])});return out};
/* Reposición de permisos: la confirma la jefatura (la del permiso o la actual); si no tiene jefatura, RH */
const repBosses=x=>[x.boss,who(x.emp)?.boss].filter(Boolean);
const confOK=(c,x)=>{const bs=repBosses(x);if(bs.length)return bs.includes(c.by)||(!c.by&&bs.some(b=>who(b)?.name===c.byName));
  const p=who(c.by)||(S.all||[]).find(q=>q.name===c.byName);return !!(p&&p.role==='rh'&&p.id!==x.emp)};
const blkDue=(x,b)=>x.status==='ok'&&!b.done&&!!b.k&&b.k<=TK;
const repDue=x=>(x.reps||[]).some(b=>blkDue(x,b));
const isConfirmer=x=>{const u=me();if(!u||x.emp===u.id)return false;const bs=repBosses(x);return bs.length?bs.includes(u.id):u.role==='rh'};
const canConfirmBlk=(x,b)=>blkDue(x,b)&&isConfirmer(x);
const canConfirm=x=>(x.reps||[]).some(b=>canConfirmBlk(x,b));
/* Lista de bloques por confirmar: {x, b} */
const toConfirm=()=>S.perms.flatMap(x=>(x.reps||[]).filter(b=>canConfirmBlk(x,b)).map(b=>({x,b}))).sort((p,q)=>p.b.k.localeCompare(q.b.k));
const repWho=x=>{const b=repBosses(x)[0];return b?(who(b)?.name||'la jefatura'):'RH'};
const canPick=k=>k>=TK&&isBiz(k)&&!booked(V.user).has(k)&&!isBday(V.user,k);
/* Reparte una selección entre días pagados y sin goce (los últimos días son los sin goce) */
/* Días que se ganan entre hoy y una fecha futura (1 por cada mes cumplido) */
const earnedAt=(start,k)=>accMonths(start,P(k))*POR_MES;
/* Reparte una selección en días pagados, adelantados y sin goce.
   "free" es lo disponible hoy. Para fechas futuras también cuentan los días que se ganan antes de esa fecha (adelantados).
   Lo que no alcanza ni con eso es sin goce. */
function splitPaid(days,free,start){start=null;const now=0;let used=0;
  return [...days].sort((a,b)=>a.k.localeCompare(b.k)).map(d=>{const v=dv(d.p),cap=free+(start?earnedAt(start,d.k)-now:0);
    const paid=Math.max(0,Math.min(v,cap-used)),nowPaid=Math.max(0,Math.min(paid,free-used));used+=paid;return{...d,unpaid:v-paid,adv:paid-nowPaid}})}
const advOf=r=>r.days.reduce((s,d)=>s+(+d.adv||0),0);
/* Fecha en que una persona con saldo negativo (días adelantados) vuelve a quedar en 0 */
function coverDate(p,deficit){return K(monthiv(p.start,accMonths(p.start)+Math.ceil(deficit/POR_MES)))}
function advText(p,b){return b.avail<0?`Adelantó ${dias(-b.avail)}; queda al día el ${fD(coverDate(p,-b.avail))}`:''}
const firstName=n=>String(n).split(' ')[0];
/* Personas cuyo calendario puede ver quien está conectado */
function visiblePeople(){const u=me();if(u.role==='rh')return S.people.filter(p=>p.id!==u.id);return S.people.filter(p=>p.boss===u.id)}
function teamOptions(){const u=me(),ppl=visiblePeople().sort((a,b)=>a.name.localeCompare(b.name));if(!ppl.length)return '';
  let o=`<option value="none">Solo mis días</option>`;
  if(u.role==='rh'){o+=`<option value="all">Todo el personal</option>`+depts().filter(d=>ppl.some(p=>(p.dept||'Sin departamento')===d)).map(d=>`<option value="dept:${esc(d)}">${esc(d)}</option>`).join('');
    const mine=S.people.filter(p=>p.boss===u.id);if(mine.length)o+=`<option value="team">Mi equipo</option>`}
  else o+=`<option value="team">Todo mi equipo</option>`;
  o+=`<optgroup label="Una persona">${ppl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</optgroup>`;
  return o.replace(`value="${V.team}"`,`value="${V.team}" selected`)}
function teamFilter(){const v=V.team,ppl=visiblePeople();if(!ppl.length||v==='none')return[];
  if(v==='all')return ppl;if(v==='team')return S.people.filter(p=>p.boss===me().id);if(v.startsWith('dept:'))return ppl.filter(p=>(p.dept||'Sin departamento')===v.slice(5));return ppl.filter(p=>p.id===v)}
function outMap(ppl){const m=new Map(),add=(k,o)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(o)};
  ppl.forEach(p=>{S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status))r.days.forEach(d=>add(d.k,{name:p.name,pend:r.status!=='ok',p:d.p}))});
    S.perms.forEach(x=>{if(x.emp===p.id&&live(x.status))add(x.k,{name:p.name,pend:x.status!=='ok',perm:x.hours})})});
  return m}
/* Quién más del mismo equipo sale en esos días */
function clashes(x){const e=who(x.emp);if(!e||x.id[0]!=='V')return[];const v=me(),peers=S.people.filter(p=>p.id!==e.id&&((e.boss&&p.boss===e.boss)||(e.dept&&p.dept===e.dept))&&(v.role==='rh'||p.boss===v.id));
  const ks=new Set(x.days.map(d=>d.k)),res=[];
  peers.forEach(p=>{const hit=[];S.reqs.forEach(r=>{if(r.emp===p.id&&live(r.status)&&r.id!==x.id)r.days.forEach(d=>{if(ks.has(d.k))hit.push(d.k)})});if(hit.length)res.push(`${p.name} (${hit.sort().map(fD).join(', ')})`)});
  return res}
const overLimit=ppl=>ppl.filter(p=>bal(p.id).avail>ACUM);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fB=b=>b?`${+b.slice(3)} de ${MESES[+b.slice(0,2)-1]}`:'—';
const depts=()=>[...new Set(S.people.map(p=>p.dept||'Sin departamento'))].sort((a,b)=>a.localeCompare(b));
function groups(days){const s=[...days].sort((a,b)=>a.k.localeCompare(b.k)),g=[];s.forEach(d=>{const l=g.at(-1);if(l&&nextBiz(l.at(-1).k)===d.k)l.push(d);else g.push([d])});return g}
const hn=p=>p==='am'?'mañana':'tarde';
function summ(days){return groups(days).map(g=>{if(g.length===1)return fD(g[0].k)+(g[0].p!=='full'?` (${hn(g[0].p)})`:'');const h=g.filter(d=>d.p!=='full');return `${fD(g[0].k)} al ${fD(g.at(-1).k)}${h.length?' ('+h.map(d=>fD(d.k)+' '+hn(d.p)).join(', ')+')':''}`}).join(' y ')}
function nextVac(id){const d=[];S.reqs.forEach(r=>{if(r.emp===id&&r.status==='ok')r.days.forEach(x=>{if(x.k>=TK)d.push(x)})});if(!d.length)return null;const g=groups(d)[0];return{label:summ(g),t:total(g)}}
const STATUS={jefatura:'Con jefatura',rh:'Con RH',ok:'Aprobada',no:'Rechazada',cancel:'Cancelada'};
function statusText(x){const b=who(x.emp)?.boss;if(x.status==='jefatura')return `Esperando a ${who(b)?.name||'jefatura'}`;if(x.status==='rh')return 'Esperando a RH';if(x.status==='ok')return x.id[0]==='V'?'Aprobada':'Aprobado';if(x.status==='cancel')return 'Cancelada';return `Rechazada${x.reason?': '+esc(x.reason):''}`}
function queue(){const u=me();return [...S.reqs,...S.perms].filter(x=>{const e=who(x.emp);if(!e)return false;return (x.status==='jefatura'&&e.boss===u.id)||(x.status==='rh'&&u.role==='rh'&&x.emp!==u.id)}).sort((a,b)=>a.created-b.created)}

const ICON_W='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
function alertHTML(u,b){
  const out=[];
  if(b.avail>ACUM)out.push(`Tienes <strong>${dias(b.avail)} acumulados</strong>, más del máximo de ${ACUM}. Coordina con tu jefatura para programar vacaciones.`);
  const scope=u.role==='rh'?S.people.filter(p=>p.id!==u.id):S.people.filter(p=>p.boss===u.id);
  const over=overLimit(scope);
  if(over.length)out.push(`${u.role==='rh'?'En la empresa':'En tu equipo'}, ${over.length===1?'1 persona tiene':over.length+' personas tienen'} más de ${ACUM} días acumulados: ${over.map(p=>`<strong>${esc(p.name)}</strong> (${num(bal(p.id).avail)})`).join(', ')}.`);

function updReader(){const r=V.read;if(!r)return;const t=document.getElementById('rTime'),e=document.getElementById('rEnd'),b=document.getElementById('rOk'),bar=document.getElementById('rBar');if(!t)return;
  const m=Math.floor(r.left/60),s=String(r.left%60).padStart(2,'0');
  t.innerHTML=r.left>0?`${r.paused?'<em>En pausa</em> · ':''}Tiempo mínimo: <strong>${m}:${s}</strong>`:'Tiempo mínimo cumplido';t.className=r.left>0?'':'ok';
  e.textContent=r.end?'Llegaste al final de esta parte':'Baja hasta el final de esta parte';e.className=r.end?'ok':'';
  b.disabled=!(r.left<=0&&r.end);if(bar)bar.style.width=Math.min(100,100-r.left/r.need*100)+'%'}
function readerStop(){clearInterval(G.rtimer);G.robs?.disconnect();document.body.classList.remove('reading')}
async function readerMount(){
  const r=V.read;readerStop();if(!r)return;document.body.classList.add('reading');
  const box=document.getElementById('pdfv');if(!box)return;
  const p=S.pols.find(x=>x.id===r.id),[a,b]=polRanges(p)[r.part-1];
  if(r.tPart!==r.part){r.tPart=r.part;r.left=r.need;r.end=false}
  updReader();
  try{const doc=await polDoc(p);
    for(let n=a;n<=b;n++){if(V.read!==r||r.tPart!==r.part||!document.body.contains(box))return;
      const page=await doc.getPage(n),w=box.clientWidth||800,v1=page.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),vp=page.getViewport({scale:w/v1.width*dpr});
      const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.setAttribute('role','img');c.setAttribute('aria-label',`Página ${n}`);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const h=box.querySelector(`[data-pg="${n}"]`);if(h){h.innerHTML='';h.appendChild(c)}}
  }catch(e){console.error(e);box.innerHTML=`<p class="empty">No se pudo abrir el PDF: ${esc(e.message||e)}</p>`;return}
  if(V.read!==r)return;

}

async function gxRaw(method,path,body,type){const r=await fetch('https://graph.microsoft.com/v1.0'+path,{method,headers:{Authorization:'Bearer '+await token(),'Content-Type':type},body});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new GraphError(r.status,j?.error?.message||r.statusText);return j}
async function uploadFile(drive,name,file){
  const path=`/drives/${drive}/root:/${encodeURIComponent(name)}:`;
  if(file.size<4e6)return gxRaw('PUT',path+'/content',file,file.type||'application/octet-stream');
  const ses=await gx('POST',path+'/createUploadSession',{item:{'@microsoft.graph.conflictBehavior':'rename'}}),CH=327680*10;let res=null;
  for(let o=0;o<file.size;o+=CH){const end=Math.min(o+CH,file.size);toast(`Subiendo archivo… ${Math.round(end/file.size*100)}%`);
    const r=await fetch(ses.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${end-1}/${file.size}`},body:file.slice(o,end)});
    if(!r.ok)throw new Error('No se pudo subir el archivo ('+r.status+').');res=await r.json().catch(()=>null)}
  return res;
}

async function capMount(){

  const bar=document.getElementById('cBar'),info=document.getElementById('cInfo'),ok=document.getElementById('cOk'),v=document.getElementById('cv');

  const done=()=>{ok.disabled=false;if(bar)bar.style.width='100%';info.innerHTML='<span class="ok">Terminaste el video</span>'};
  if(v){const key=`gg-cap-${c.spId}-${k.round||1}-${V.user}`;let max=0;try{max=+localStorage.getItem(key)||0}catch(e){}
    try{await G.drivesReady;const it=await gx('GET',`/drives/${G.capDrive}/items/${c.videoId}`);v.src=it['@microsoft.graph.downloadUrl']}catch(e){info.textContent='No se pudo cargar el video: '+(e.message||e);return}
    v.addEventListener('loadedmetadata',()=>{if(max>1&&max<v.duration-1)v.currentTime=max});
    v.addEventListener('timeupdate',()=>{if(!v.seeking&&v.currentTime>max&&v.currentTime-max<2)max=v.currentTime;if(v.duration){bar.style.width=Math.min(100,max/v.duration*100)+'%'}try{localStorage.setItem(key,String(max))}catch(e){}});
    v.addEventListener('seeking',()=>{if(v.currentTime>max+1)v.currentTime=max});
    v.addEventListener('ratechange',()=>{if(v.playbackRate>1)v.playbackRate=1});
    v.addEventListener('ended',()=>{if(max>=v.duration-2)done()});
    if(k.vdone)done();return}
  /* link externo: tiempo mínimo según la duración que puso RH */
  const need=Math.max(30,(c.dur||1)*60);if(k.left==null)k.left=need;
  const upd=()=>{const m=Math.floor(k.left/60),s=String(k.left%60).padStart(2,'0');if(k.left<=0)return done();bar.style.width=(100-k.left/need*100)+'%';info.innerHTML=`Mira el video completo · disponible en <strong>${m}:${s}</strong>`};
  upd();G.ctimer=setInterval(()=>{if(V.cap!==k){clearInterval(G.ctimer);return}if(document.visibilityState==='visible'&&k.left>0)k.left--;upd()},1000);
}

function capValidate(e,isRound){

    if(e.mode==='link'&&!(+e.dur>0))return'Pon la duración del video en minutos.';
    if(!(+e.min>=1&&+e.min<=100))return'La nota mínima debe estar entre 1 y 100.'}
  if(!e.qs.length)return'Agrega al menos una pregunta.';
  for(const [i,q] of e.qs.entries()){const n=i+1;if(!q.t.trim())return`Escribe el texto de la pregunta ${n}.`;
    if(q.type!=='tf'&&q.opts.some(o=>!o.trim()))return`Llena todas las opciones de la pregunta ${n}, o quita las que sobran.`;
    if(!q.ok.length)return`Marca la respuesta correcta de la pregunta ${n}.`;
    if(q.type!=='multi'&&q.ok.length!==1)return`La pregunta ${n} debe tener una sola respuesta correcta.`}
  return'';
}

const DC={brand:'#0D6174',garrett:'#0D6174',aura:'#C98A1B',none:'#A9B4BA',ok:'#0D6174',pend:'#E0A83A',b1:'#B9DCE3',b2:'#6FAFBE',b3:'#0D6174',over:'#B3242D',grid:'#E2E7EA',txt:'#66737C'};

function donutSVG(segs,center,sub){
  const tot=segs.reduce((a,x)=>a+x.v,0),R0=54,C=2*Math.PI*R0,act=segs.filter(x=>x.v>0);let off=0;
  const arcs=tot?act.map(x=>{const len=x.v/tot*C,gap=act.length>1?2:0;
    const el=`<circle r="${R0}" cx="70" cy="70" fill="none" stroke="${x.c}" stroke-width="20" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(x.l)}: ${num(x.v)}</title></circle>`;off+=len;return el}).join('')
    :`<circle r="${R0}" cx="70" cy="70" fill="none" stroke="${DC.grid}" stroke-width="20"/>`;
  return `<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(segs.map(x=>x.l+': '+num(x.v)).join(', '))}" style="overflow:visible"><circle class="ripple" cx="70" cy="70" r="54"/><g class="arcs">${arcs}</g>
    <text x="70" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A33">${center}</text><text x="70" y="89" text-anchor="middle" font-size="11.5" fill="${DC.txt}">${sub}</text></svg>
    <ul class="dleg">${segs.map(x=>`<li><i style="background:${x.c}"></i>${esc(x.l)}<b>${num(x.v)}</b></li>`).join('')}</ul></div>`;
}
function barsSVG(cats,series,unit){
  const W=640,H=210,L=34,B=24,T=10,cw=(W-L-6)/cats.length,bw=Math.min(26,cw*.6);
  const tots=cats.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0)),mx=Math.max(1,...tots),step=Math.max(1,Math.ceil(mx/4)),top=step*4;
  const y=v=>T+(H-T-B)*(1-v/top);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${DC.grid}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${DC.txt}">${v}</text>`;
  const bars=cats.map((c,i)=>{let acc=0;const x=L+cw*i+(cw-bw)/2;
    const rects=series.map(s=>{const v=s.vals[i];if(!v)return'';const y1=y(acc+v),h=y(acc)-y1;acc+=v;return `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(h,1)}" rx="3" fill="${s.c}"><title>${c}, ${esc(s.n)}: ${num(v)} ${unit}</title></rect>`}).join('');
    return rects+`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="${DC.txt}">${c}</text>`}).join('');
  return `<div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras por mes">${g}${bars}</svg><div class="bleg">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div></div>`;
}
function rankSVG(rows,limit){

/* Permisos */
const MOT=['Cita médica','Trámite personal','Asunto familiar','Estudios','Otro'];
function tOpts(a,b,v){let o='';for(let t=a;t<=b;t+=.5)o+=`<option value="${t}" ${t===v?'selected':''}>${fT(t)}</option>`;return o}
function pCheck(f){
  const bl=fBlocks(f);
  if(!f.k||bl.some(b=>!b.k))return[0,bl.length>1?'Elige el día del permiso y los dos días en que repones.':'Elige el día del permiso y el día en que lo repones.'];
  if(f.k<TK)return[0,'El permiso no puede ser en una fecha pasada.'];
  if(!isBiz(f.k))return[0,`El ${fD(f.k)} no es día laboral.`];
  if(f.start+f.hours>24)return[0,'El permiso debe terminar el mismo día. Elige una hora más temprano.'];
  if(f.motive==='Otro'&&!(f.other||'').trim())return[0,'Escribe una breve explicación del motivo.'];
  const nm=b=>bl.length>1?(b.n===1?'La primera hora de reposición':'La segunda hora de reposición'):'La reposición';
  for(const b of bl){
    if(b.start+b.h>24)return[0,`${nm(b)} debe terminar el mismo día. Elige una hora más temprano.`];
    if(b.k<f.k)return[0,`${nm(b)} debe ser el mismo día del permiso o después.`];
    if(b.k===f.k&&b.start<f.start+f.hours&&b.start+b.h>f.start)return[0,`${nm(b)} choca con el horario del permiso.`];
  }
  if(bl.length>1&&bl[0].k===bl[1].k&&bl[0].start<bl[1].start+1&&bl[1].start<bl[0].start+1)return[0,'Las dos horas de reposición chocan entre sí. Elige otra hora para una de ellas.'];
  return[1,`Sales el <strong>${fD(f.k)}</strong> de ${fT(f.start)} a ${fT(f.start+f.hours)} y repones ${bl.length>1?`<strong>1 hora</strong> el <strong>${fD(bl[0].k)}</strong> de ${fT(bl[0].start)} a ${fT(bl[0].start+1)} y <strong>otra hora</strong> el <strong>${fD(bl[1].k)}</strong> de ${fT(bl[1].start)} a ${fT(bl[1].start+1)}`:`el <strong>${fD(bl[0].k)}</strong> de ${fT(bl[0].start)} a ${fT(bl[0].start+bl[0].h)}`}.`];
}
const pickOK=(field,k)=>field==='k'?(k>=TK&&isBiz(k)):(k>=(V.pf.k||TK)&&P(k).getDay()!==0&&!S.hol[k]);
function dateField(field,val){
  const open=V.picker===field;
  let pop='';
  if(open){const m=V.pm,y=m.getFullYear(),mo=m.getMonth(),lead=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
    let g='';for(let i=0;i<lead;i++)g+='<span></span>';
    for(let d=1;d<=dim;d++){const k=K(new Date(y,mo,d));g+=`<button type="button" data-pday="${k}" class="${k===val?'on':''} ${S.hol[k]?'hol':''}" ${pickOK(field,k)?'':'disabled'} title="${fD(k)}${S.hol[k]?', '+esc(S.hol[k]):''}">${d}</button>`}
    const atStart=y===TODAY.getFullYear()&&mo===TODAY.getMonth();
    pop=`<div class="pop" role="dialog" aria-label="Elegir fecha"><div class="ph"><button type="button" class="arrow" data-pmv="-1" ${atStart?'disabled':''} aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button><span>${cap(mF.format(m).replace(' de ',' '))}</span><button type="button" class="arrow" data-pmv="1" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="dow">${['L','K','M','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="pg">${g}</div></div>`}
  return `<div class="pickwrap"><button type="button" class="datebtn" data-pick="${field}" aria-expanded="${open}">${val?fD(val):'Elegir fecha'}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>${pop}</div>`;
}
function vPerm(){
  const u=me(),f=V.pf,[ok,msg]=pCheck(f);
  return `<div class="perm">
  <div class="box">
    <h2>Pedir permiso</h2>
    <div class="two"><div class="f"><span>Día</span>${dateField('k',f.k)}</div>
    <label class="f"><span>Sales a las</span><select data-pf="start">${tOpts(0,23.5,f.start)}</select></label></div>
    <div class="f"><span>Duración</span><div class="seg lg" role="radiogroup">${[1,2].map(h=>`<button type="button" role="radio" aria-checked="${f.hours===h}" data-hours="${h}">${h} ${h===1?'hora':'horas'}</button>`).join('')}</div></div>
    <label class="f"><span>Motivo</span><select data-pf="motive">${MOT.map(m=>`<option ${m===f.motive?'selected':''}>${m}</option>`).join('')}</select></label>
    ${f.motive==='Otro'?`<label class="f"><span>Explica el motivo</span><textarea data-pf="other" rows="3" placeholder="Cuéntale a tu jefatura para qué es el permiso" style="resize:vertical">${esc(f.other||'')}</textarea></label>`:''}
    ${f.hours===2&&splitOK()?`<div class="f"><span>¿Cómo repones las 2 horas?</span><div class="seg lg" role="radiogroup">${[[0,'Todo junto'],[1,'En dos partes (1 h y 1 h)']].map(([v,t])=>`<button type="button" role="radio" aria-checked="${!!f.split===!!v}" data-split="${v}">${t}</button>`).join('')}</div></div>`:''}
    <div class="two"><div class="f"><span>${f.hours===2&&f.split?'Primera hora: repones el día':'Repones el día'}</span>${dateField('repK',f.repK)}</div>
    <label class="f"><span>Desde las</span><select data-pf="repStart">${tOpts(0,23.5,f.repStart)}</select></label></div>
    ${f.hours===2&&f.split?`<div class="two"><div class="f"><span>Segunda hora: repones el día</span>${dateField('rep2K',f.rep2K)}</div>
    <label class="f"><span>Desde las</span><select data-pf="rep2Start">${tOpts(0,23.5,f.rep2Start)}</select></label></div>`:''}
    <div class="preview ${ok?'':'bad'}" id="pprev">${msg}</div>
    <button class="btn primary wide" id="psend" data-act="sendPerm" ${ok?'':'disabled'}>Enviar permiso</button>
  </div>
  <div>${pendBox('P')}</div>
  </div></div>`;
}

/* Mis solicitudes (vacaciones y permisos, con filtros) */
const isPend=s=>s==='jefatura'||s==='rh';
const EST_F=[['all','Todas'],['pend','En aprobación'],['ok','Aprobadas'],['no','Rechazadas'],['cancel','Canceladas']];
const matchEst=(x,e)=>e==='all'||(e==='pend'?isPend(x.status):x.status===e);
function myItems(){const u=me();return [...S.reqs.filter(r=>r.emp===u.id),...S.perms.filter(x=>x.emp===u.id)]}
const itemDate=x=>x.id[0]==='V'?([...x.days].sort((a,b)=>a.k.localeCompare(b.k))[0]?.k||''):x.k;
function itemRow(x){const u=me(),isV=x.id[0]==='V';
  const head=isV?summ(x.days):`${fD(x.k)}, ${fT(x.start)} a ${fT(x.start+x.hours)}`;
  const sub=isV?statusText(x)+(x.note?` · ${esc(x.note)}`:''):`${esc(x.motive)} · Repone ${repTxt(x)}${x.repaid?' · Ya repuesto':x.reps.length>1&&x.reps.some(b=>b.done)?' · 1 de 2 horas repuesta'+(repDue(x)?`, falta que ${esc(repWho(x))} confirme la otra`:''):repDue(x)?` · Falta que ${esc(repWho(x))} confirme la reposición`:''}${x.status==='no'&&x.reason?' · Motivo: '+esc(x.reason):''}${isPend(x.status)?' · '+statusText(x):''}`;
  const amt=isV?`${dias(total(x.days))}${advOf(x)?` <span class="tagx adv">${num(advOf(x))} adelantado${advOf(x)>1?'s':''}</span>`:''}${x.unpaid?` <span class="tagx">${num(x.unpaid)} sin goce</span>`:''}`:`${x.hours} h`;
  const pill=isV?STATUS[x.status]:(x.status==='ok'&&x.repaid?'Repuesto':STATUS[x.status].replace('Aprobada','Aprobado').replace('Rechazada','Rechazado').replace('Cancelada','Cancelado'));
  const can=u.role==='rh'&&isPend(x.status)?`<button class="lnk red" data-act="${isV?'cancelReq':'cancelPerm'}" data-id="${x.id}">Cancelar</button>`:'';
  return `<li><div class="main"><strong><span class="kind ${isV?'v':'p'}">${isV?'Vacaciones':'Permiso'}</span>${head}</strong><p>${sub}</p></div><span class="amt">${amt}</span><span class="pill ${x.status}">${pill}</span>${can}</li>`}
function pendBox(t){const all=myItems().filter(x=>x.id[0]===t),pend=all.filter(x=>isPend(x.status)).sort((a,b)=>b.created-a.created);
  const name=t==='V'?'vacaciones':'permisos';
  return `<div class="section"><div class="bar"><h2>${t==='V'?'Solicitudes':'Permisos'} en aprobación</h2>${all.length?`<button class="btn sm" data-tab="mis" data-mft="${t}">Ver todas (${all.length})</button>`:''}</div>
    <ul class="rows">${pend.map(itemRow).join('')||`<li><p class="empty">${all.length?`No tienes ${name} en aprobación.`:`Aún no has pedido ${name}.`}</p></li>`}</ul></div>`}
function vMis(){
  const u=me(),f=V.mf,all=myItems();
  const byT=all.filter(x=>f.t==='all'||x.id[0]===f.t);
  const list=byT.filter(x=>matchEst(x,f.e)).sort((a,b)=>f.e==='pend'?itemDate(a).localeCompare(itemDate(b)):b.created-a.created);
  const cnt=e=>byT.filter(x=>matchEst(x,e)).length;
  const btn=(attr,val,cur,label,c)=>`<button type="button" class="chip" aria-pressed="${val===cur}" data-${attr}="${val}">${label}${c!=null?` <b>${c}</b>`:''}</button>`;
  const shown=list.slice(0,f.n);
  return `<h2>Mis solicitudes</h2>
  <div class="filters"><div class="chips">${[['all','Todo'],['V','Vacaciones'],['P','Permisos']].map(([k,l])=>btn('mft',k,f.t,l)).join('')}</div>
  <div class="chips">${EST_F.map(([k,l])=>btn('mfe',k,f.e,l,cnt(k))).join('')}</div></div>
  <ul class="rows">${shown.map(itemRow).join('')||'<li><p class="empty">No hay solicitudes con este filtro.</p></li>'}</ul>
  ${list.length>shown.length?`<p style="text-align:center;margin-top:12px"><button class="btn sm" data-act="mfMore">Ver más (${list.length-shown.length})</button></p>`:''}
  ${all.length&&u.role!=='rh'?'<p class="note">¿Necesitas cancelar o cambiar algo? Avísale a tu jefatura o a RH.</p>':''}`}

/* Aprobaciones */
function vAprob(){
  const u=me(),q=queue(),rc=toConfirm(),team=S.people.filter(p=>p.boss===u.id);
  const row=x=>{const e=who(x.emp),isV=x.id[0]==='V';
    const det=isV?`${summ(x.days)}. Tiene ${dias(bal(e.id).avail)}.`:`${fD(x.k)}, ${fT(x.start)} a ${fT(x.start+x.hours)} (${x.motive}). Repone ${repTxt(x)}`;
    const extra=(x.status==='rh'&&e.boss?` Aprobado por ${esc(who(e.boss)?.name)}.`:'')+(isV&&advOf(x)?` <span class="tagx adv">${dias(advOf(x))} por adelantado (los gana antes de esas fechas)</span>`:'')+(isV&&x.unpaid?` <span class="tagx">Incluye ${dias(x.unpaid)} sin goce de salario</span>`:'');
    const cl=isV?clashes(x):[];
    const acts=`<a class="btn sm primary" href="${CONFIG.teamsAprobaciones}" target="_blank" rel="noopener">Abrir en Teams</a>`,_old=V.rejecting===x.id?`<input id="why" placeholder="Motivo (opcional)"><button class="btn sm" data-act="noCancel">Volver</button><button class="btn sm danger" data-act="noOk" data-id="${x.id}">Rechazar</button>`
      :`<button class="btn sm" data-act="no" data-id="${x.id}">Rechazar</button><button class="btn sm primary" data-act="yes" data-id="${x.id}">Aprobar</button>`;
    return `<li><div class="main"><strong>${esc(e.name)}, ${isV?'vacaciones':'permiso'}</strong><p>${det}${extra}</p>${cl.length?`<p class="clash">⚠ Esos días también sale: ${cl.map(esc).join('; ')}</p>`:''}</div><span class="amt">${isV?dias(total(x.days)):x.hours+' h'}</span><div class="acts">${acts}</div></li>`};
  return `<h2>Pendientes</h2><p class="note" style="margin:-6px 0 12px">Apruebas o rechazas desde la tarjeta que te llega en Teams (app Aprobaciones) o en tu correo. Aquí ves el detalle${u.role==='rh'?'':' y si choca con otras personas de tu equipo'}.</p><ul class="rows">${q.map(row).join('')||'<li><p class="empty">No tienes nada por aprobar.</p></li>'}</ul>
  ${rc.length?`<div class="section"><h2>Reposiciones por confirmar</h2><p class="note" style="margin:-6px 0 12px">Confirma cuando la persona ya repuso el tiempo del permiso. Si todavía no lo ha repuesto, déjalo pendiente.</p><ul class="rows">${rc.map(({x,b})=>{const e=who(x.emp),two=x.reps.length>1;
    return `<li><div class="main"><strong>${esc(e.name)}, permiso de ${x.hours} h${two?` · ${b.n===1?'primera':'segunda'} hora de reposición`:''}</strong><p>Permiso el ${fD(x.k)}, ${fT(x.start)} a ${fT(x.start+x.hours)} (${esc(x.motive)}). Tenía que reponer ${two?'1 hora ':''}el ${blkTxt(b)}.${two?` La ${b.n===1?'segunda':'primera'} hora: ${blkTxt(x.reps[2-b.n])}${x.reps[2-b.n].done?', ya confirmada':''}.`:''}</p></div><span class="amt">${b.h} h</span><div class="acts"><button class="btn sm primary" data-act="confirmRep" data-id="${x.id}" data-blk="${b.n}">Sí, ya repuso</button></div></li>`}).join('')}</ul></div>`:''}
  ${team.length?`<div class="section"><h2>Mi equipo</h2><div class="tbl"><table><thead><tr><th>Persona</th><th class="num">Disponibles</th><th class="num">En aprobación</th><th>Próximas vacaciones</th><th class="num">Por reponer</th><th></th></tr></thead><tbody>
  ${team.map(p=>{const b=bal(p.id),o=owed(p.id),nv=nextVac(p.id);return `<tr><td>${esc(p.name)}</td><td class="num ${b.avail>ACUM?'hi':b.avail<0?'neg':''}" title="${advText(p,b)}">${num(b.avail)}${b.avail<0?' <span class="tagx adv">adelantado</span>':''}</td><td class="num">${num(b.pending)}</td><td>${nv?nv.label:'—'}</td><td class="num">${o?o+' h':'—'}</td><td></td></tr>`}).join('')}
  </tbody></table></div></div>`:''}`;
}

/* RH: personal */

const bossOpts=(sel,self)=>`<option value="">Sin jefatura (aprueba solo RH)</option>`+S.people.filter(p=>(p.role==='jefe'||p.role==='rh')&&p.id!==self).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
const bdayFields=(pre,b)=>`<label class="f"><span>Cumpleaños (día)</span><select id="${pre}BD"><option value="">—</option>${Array.from({length:31},(_,i)=>`<option ${b&&+b.slice(3)===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>
  <label class="f"><span>Mes</span><select id="${pre}BM"><option value="">—</option>${MESES.map((m,i)=>`<option value="${i+1}" ${b&&+b.slice(0,2)===i+1?'selected':''}>${cap(m)}</option>`).join('')}</select></label>`;
const readBday=pre=>{const d=document.getElementById(pre+'BD').value,m=document.getElementById(pre+'BM').value;return d&&m?`${pad(m)}-${pad(d)}`:''};

function parseDate(s){s=String(s||'').trim();let m;
  if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(s)){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12){[d,mo]=[mo,d]}return `${y}-${pad(mo)}-${pad(d)}`}
  return ''}
function parseBday(s){s=String(s||'').trim();let m;
  if(m=/^(\d{1,2})-(\d{1,2})$/.exec(s))return `${pad(m[1])}-${pad(m[2])}`;
  const d=parseDate(s);return d?d.slice(5):''}
function parseImport(txt){
  const rows=txt.split(/\r?\n/).map(l=>l.split('\t')).filter(r=>r.some(c=>c.trim()));
  let dispMode=false;if(rows.length&&/nombre/i.test(rows[0][0])){dispMode=/disponible/i.test(rows[0][7]||'');rows.shift()}
  const raw=rows.map(r=>({name:(r[0]||'').trim(),email:lc(r[1]),dept:(r[2]||'').trim(),role:ROLE_IN[(r[3]||'').trim()]||'colab',bossName:(r[4]||'').trim(),
    start:parseDate(r[5])||TK,bday:parseBday(r[6]),prior:parseFloat(String(r[7]||'0').replace(',','.'))||0})).map(x=>dispMode?{...x,prior:earnedFrom(x.start)-x.prior}:x);
  const byName=n=>{n=lc(n);return raw.find(x=>lc(x.name)===n)?.email||S.all.find(p=>lc(p.name)===n)?.email||''};
  return raw.map(x=>({...x,boss:x.bossName?byName(x.bossName):'',skip:!x.email?'sin correo':S.all.some(p=>p.email===x.email)?'ya existe':''}));

function payrollSheets(a,b){
  const inP=k=>k>=a&&k<=b;
  const base=(p,first,n,val,desc)=>({_emp:empKey(p),'Empleado':empNoX(p),'Unidad Operativa':unitX(p),'Rige desde':xd(first),'Dias':n,'Afecta planilla':xd(first),'Valor':val,'Campo total dias':'','Descripcion':desc});
  const vac=[],sin=[],con=[];
  S.reqs.filter(r=>r.status==='ok').sort((x,y)=>x.created-y.created).forEach(r=>{const p=who(r.emp);
    let paidLeft=total(r.days)-(r.unpaid||0);const paidD=[],unpD=[];
    [...r.days].sort((x,y)=>x.k.localeCompare(y.k)).forEach(d=>{const v=dv(d.p),pd=Math.max(0,Math.min(v,paidLeft));paidLeft-=pd;
      if(!inP(d.k))return;if(pd>0)paidD.push({k:d.k,p:pd<1&&d.p==='full'?'am':d.p,v:pd});if(v-pd>0)unpD.push({k:d.k,p:v-pd<1&&d.p==='full'?'pm':d.p,v:v-pd})});
    const sum=l=>l.reduce((s,d)=>s+d.v,0);
    runsOf(paidD,r.emp).forEach(g=>{const n=sum(g);vac.push(base(p,g[0].k,n,'HR_VACACION',`Disfrute de ${dias(n)} de vacaciones: ${descDays(g)}`))});
    runsOf(unpD,r.emp).forEach(g=>{const n=sum(g);sin.push(base(p,g[0].k,n,'HR_PER_SIN',`Permiso sin goce de salario ${dias(n)}: ${descDays(g)}`))})});
  S.perms.filter(x=>x.status==='ok'&&inP(x.k)).sort((x,y)=>x.created-y.created).forEach(x=>{const p=who(x.emp);
    con.push(base(p,x.k,Math.round(x.hours/8*1000)/1000,'HR_PER_CON',`Permiso con goce de salario ${descDays([{k:x.k,p:'full'}])}, ${fT(x.start)} a ${fT(x.start+x.hours)} (${x.hours} h)`))});
  return{vac,con,sin};
}
async function downloadExcel(a,b){a=a||V.xf.a;b=b||V.xf.b;
  try{toast('Preparando Excel…');await loadXLSX()}catch(e){toast(e.message);return}
  const ppl=[...S.all].sort((a,b)=>(a.dept||'').localeCompare(b.dept||'')||a.name.localeCompare(b.name));
  const saldos=ppl.map(p=>{const b=bal(p.id),sg=S.reqs.filter(r=>r.emp===p.id&&r.status==='ok').reduce((s,r)=>s+(r.unpaid||0),0);
    return{'Nombre':p.name,'Correo':p.email,'Empresa':p.company||'','Número de empleado':p.empNo||'','Unidad operativa':p.unit||'','Departamento':p.dept||'','Perfil':ROLE_OUT[p.role]||'','Jefatura':who(p.boss)?.name||p.boss||'','Activo':p.active?'Sí':'No',
      'Fecha de ingreso':xd(p.start),'Días ganados':b.earned,'Días tomados':b.taken,'En aprobación':b.pending,'Disponibles':b.avail,'Días sin goce (aprobados)':sg,'Horas por reponer':owed(p.id)}});
  const vac=[];
  S.reqs.filter(r=>r.status!=='no'&&r.status!=='cancel').forEach(r=>{const p=who(r.emp);const days=[...r.days].sort((a,b)=>a.k.localeCompare(b.k));
    let paidLeft=total(days)-(r.unpaid||0);
    days.forEach(d=>{const v=dv(d.p),paid=Math.max(0,Math.min(v,paidLeft));paidLeft-=paid;
      vac.push({'Nombre':p?.name||r.emp,'Empresa':p?.company||'','Número de empleado':p?.empNo||'','Departamento':p?.dept||'','Fecha':xd(d.k),'Fecha solicitado':xdc(r.created),'Tipo':PARTE_TXT[d.p]||d.p,'Días':v,'Con goce':paid,'Sin goce':v-paid,'Estado':ESTADO_TXT[r.status]||r.status})})});
  vac.sort((a,b)=>a.Fecha-b.Fecha||a.Nombre.localeCompare(b.Nombre));
  const perm=S.perms.filter(x=>x.status!=='no'&&x.status!=='cancel').map(x=>{const p=who(x.emp);return{'Nombre':p?.name||x.emp,'Departamento':p?.dept||'','Fecha':xd(x.k),'Fecha solicitado':xdc(x.created),
    'Horario':`${hhmm(x.start)} a ${hhmm(x.start+x.hours)}`,'Horas':x.hours,'Motivo':x.motive,'Repone':xd(x.reps[0]?.k),'Hora reposición':x.reps[0]?`${hhmm(x.reps[0].start)} a ${hhmm(x.reps[0].start+x.reps[0].h)}`:'','Repone (2.ª hora)':x.reps[1]?xd(x.reps[1].k):'','Hora reposición (2.ª hora)':x.reps[1]?`${hhmm(x.reps[1].start)} a ${hhmm(x.reps[1].start+1)}`:'','Repuesto':x.repaid?'Sí':x.reps.some(b=>b.done)?'1 de 2 horas':'No','Estado':ESTADO_TXT[x.status]||x.status}}).sort((a,b)=>a.Fecha-b.Fecha);
  const vacD=vac.filter(r=>{const k=K(r.Fecha);return k>=a&&k<=b}),permD=perm.filter(r=>{const k=K(r.Fecha);return k>=a&&k<=b});
  const pl=payrollSheets(a,b),PCOL=['Empleado','Unidad Operativa','Rige desde','Dias','Afecta planilla','Valor','Campo total dias','Descripcion'];
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(cols.map(c=>[c,'']))],{header:cols,dateNF:'dd/mm/yyyy'});ws['!cols']=cols.map(c=>({wch:Math.max(12,c.length+2,...rows.slice(0,200).map(r=>String(r[c]??'').length+1))}));XLSX.utils.book_append_sheet(wb,ws,name)};
  /* Hojas de planilla: cada fila con el color de su empresa + cajita de colores abajo */
  const addPl=(rows,name)=>{const clean=rows.map(({_emp,...r})=>r);add(clean,name,PCOL);const ws=wb.Sheets[name];
    const bd={style:'thin',color:{rgb:'C9D1D6'}},box={top:bd,bottom:bd,left:bd,right:bd};
    PCOL.forEach((c,ci)=>{const a=XLSX.utils.encode_cell({r:0,c:ci});if(ws[a])ws[a].s={font:{bold:true}}});
    rows.forEach((r,ri)=>{const col=EMP_COLOR[r._emp];if(!col)return;
      PCOL.forEach((c,ci)=>{const a=XLSX.utils.encode_cell({r:ri+1,c:ci});if(!ws[a])ws[a]={t:'s',v:''};ws[a].s={fill:{patternType:'solid',fgColor:{rgb:col.rgb}}}})});
    const r0=Math.max(rows.length,1)+2,sinEmp=rows.some(r=>!EMP_COLOR[r._emp]);
    const leg=[['Colores por empresa',''],...Object.values(EMP_COLOR).map(e=>[e.name,'']),...(sinEmp?[['Sin empresa asignada','(sin color)']]:[])];
    XLSX.utils.sheet_add_aoa(ws,leg,{origin:{r:r0,c:0}});
    leg.forEach((l,i)=>[0,1].forEach(ci=>{const a=XLSX.utils.encode_cell({r:r0+i,c:ci});if(!ws[a])ws[a]={t:'s',v:''};
      const e=Object.values(EMP_COLOR).find(e=>e.name===l[0]);
      ws[a].s={border:box,font:i===0?{bold:true}:{},...(i===0?{fill:{patternType:'solid',fgColor:{rgb:'F6F8F9'}}}:e?{fill:{patternType:'solid',fgColor:{rgb:e.rgb}}}:{})}}));
    (ws['!merges']=ws['!merges']||[]).push({s:{r:r0,c:0},e:{r:r0,c:1}});
    if(sinEmp&&ws['!cols'])ws['!cols'][0].wch=Math.max(ws['!cols'][0].wch,21);
  };
  addPl(pl.vac,'Vacaciones');addPl(pl.con,'Permisos con goce');addPl(pl.sin,'Permisos sin goce');
  add(saldos,'Saldos',['Nombre','Correo','Empresa','Número de empleado','Unidad operativa','Departamento','Perfil','Jefatura','Activo','Fecha de ingreso','Días ganados','Días tomados','En aprobación','Disponibles','Días sin goce (aprobados)','Horas por reponer']);
  add(vacD,'Vacaciones por día',['Nombre','Empresa','Número de empleado','Departamento','Fecha','Fecha solicitado','Tipo','Días','Con goce','Sin goce','Estado']);
  add(permD,'Detalle permisos',['Nombre','Departamento','Fecha','Fecha solicitado','Horario','Horas','Motivo','Repone','Hora reposición','Repone (2.ª hora)','Hora reposición (2.ª hora)','Repuesto','Estado']);
  XLSX.writeFile(wb,`Planilla vacaciones y permisos ${a} a ${b}.xlsx`);toast('Excel descargado.');
}
